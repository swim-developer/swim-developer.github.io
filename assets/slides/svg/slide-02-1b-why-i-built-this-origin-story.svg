<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <!-- Left panel: journey timeline -->
  <rect x="40" y="60" width="380" height="600" rx="16" fill="#1c2333" stroke="#30363d" stroke-width="1"/>

  <text x="230" y="100" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="bold">THE JOURNEY</text>

  <!-- Timeline vertical line -->
  <line x1="120" y1="130" x2="120" y2="620" stroke="#30363d" stroke-width="2"/>

  <!-- Stop 1: NAV Portugal -->
  <circle cx="120" cy="165" r="8" fill="#d29922"/>
  <text x="145" y="160" fill="#d29922" font-size="14" font-weight="bold">2024</text>
  <text x="145" y="180" fill="#f0f6fc" font-size="13">NAV Portugal — SWIM on</text>
  <text x="145" y="196" fill="#8b949e" font-size="13">OpenShift validation</text>

  <!-- Stop 2: Same request -->
  <circle cx="120" cy="250" r="8" fill="#d29922"/>
  <text x="145" y="245" fill="#d29922" font-size="14" font-weight="bold">2024</text>
  <text x="145" y="265" fill="#f0f6fc" font-size="13">Ireland + Slovenia</text>
  <text x="145" y="281" fill="#8b949e" font-size="13">Same gap, 3 countries</text>

  <!-- Stop 3: Airspace World -->
  <circle cx="120" cy="335" r="8" fill="#3fb950"/>
  <text x="145" y="330" fill="#3fb950" font-size="14" font-weight="bold">Mar 2025</text>
  <text x="145" y="350" fill="#f0f6fc" font-size="13">Airspace World, Lisbon</text>
  <text x="145" y="366" fill="#8b949e" font-size="13">"We wasted money" — ANSP</text>

  <!-- Stop 4: EUROCONTROL Training -->
  <circle cx="120" cy="420" r="8" fill="#58a6ff"/>
  <text x="145" y="415" fill="#58a6ff" font-size="14" font-weight="bold">May 2025</text>
  <text x="145" y="435" fill="#f0f6fc" font-size="13">EUROCONTROL Training</text>
  <text x="145" y="451" fill="#8b949e" font-size="13">4 days, Brussels, 1600+ pages</text>

  <!-- Stop 5: SFG -->
  <circle cx="120" cy="505" r="8" fill="#f85149"/>
  <text x="145" y="500" fill="#f85149" font-size="14" font-weight="bold">2025</text>
  <text x="145" y="520" fill="#f0f6fc" font-size="13">SFG Invitation</text>
  <text x="145" y="536" fill="#8b949e" font-size="13">swim-developer is born</text>

  <!-- Stop 6: Today -->
  <circle cx="120" cy="590" r="12" fill="#EE0000"/>
  <circle cx="120" cy="590" r="18" fill="none" stroke="#EE0000" stroke-width="1" stroke-opacity="0.4"/>
  <text x="145" y="585" fill="#EE0000" font-size="14" font-weight="bold">Apr 2026</text>
  <text x="145" y="605" fill="#f0f6fc" font-size="13">Today — presenting to SFG</text>

  <!-- Right panel: key insight -->
  <text x="520" y="160" fill="#f0f6fc" font-size="32" font-weight="bold">The Insight</text>
  <rect x="520" y="175" width="120" height="3" rx="1.5" fill="#EE0000"/>

  <text x="520" y="230" fill="#f0f6fc" font-size="20" font-weight="300">3 countries. Same problem.</text>
  <text x="520" y="265" fill="#f0f6fc" font-size="20" font-weight="300">Aviation experts who know</text>
  <text x="520" y="295" fill="#58a6ff" font-size="20" font-weight="600">WHAT to implement</text>
  <text x="520" y="330" fill="#f0f6fc" font-size="20" font-weight="300">but not</text>
  <text x="520" y="365" fill="#f85149" font-size="20" font-weight="600">HOW to build it.</text>

  <!-- Quote box -->
  <rect x="520" y="420" width="680" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="540" y="455" fill="#8b949e" font-size="56" font-weight="300">"</text>
  <text x="580" y="460" fill="#f0f6fc" font-size="17" font-style="italic">The essence of SWIM IS technology.</text>
  <text x="580" y="485" fill="#f0f6fc" font-size="17" font-style="italic">And the people who need it most don't</text>
  <text x="580" y="510" fill="#f0f6fc" font-size="17" font-style="italic">have the IT teams to build it.</text>

  <!-- Bottom: credentials -->
  <text x="520" y="600" fill="#8b949e" font-size="15">25 years · Software Architecture · Cloud-Native · Java · Kubernetes</text>
  <text x="520" y="625" fill="#8b949e" font-size="15">Not from aviation — from technology. That's the point.</text>
</svg>

