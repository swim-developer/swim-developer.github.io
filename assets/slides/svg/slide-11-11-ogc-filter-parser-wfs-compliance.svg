<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="48" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="bold">WFS GetFeature — Full FES 2.0 Compliance</text>
  <text x="640" y="75" text-anchor="middle" fill="#d29922" font-size="14">EUR SWIM Registry requires OGC Filter Encoding Standard 2.0</text>

  <!-- Code block (left) -->
  <rect x="40" y="100" width="620" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="100" width="620" height="35" rx="10" fill="#21262d"/>
  <rect x="40" y="125" width="620" height="10" fill="#21262d"/>
  <circle cx="62" cy="118" r="6" fill="#f85149"/>
  <circle cx="82" cy="118" r="6" fill="#d29922"/>
  <circle cx="102" cy="118" r="6" fill="#3fb950"/>
  <text x="340" y="122" text-anchor="middle" fill="#8b949e" font-size="11">GET /swim/v1/features</text>

  <text x="65" y="160" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#f85149">fes:Filter</tspan>&gt;</text>
  <text x="85" y="185" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#f85149">fes:PropertyIsEqualTo</tspan>&gt;</text>
  <text x="105" y="210" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#d29922">fes:ValueReference</tspan>&gt;</text>
  <text x="125" y="235" fill="#58a6ff" font-size="14" font-family="JetBrains Mono, monospace" font-weight="bold">airportHeliport</text>
  <text x="105" y="260" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;/<tspan fill="#d29922">fes:ValueReference</tspan>&gt;</text>
  <text x="105" y="285" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#d29922">fes:Literal</tspan>&gt;<tspan fill="#3fb950" font-weight="bold">LPPT</tspan>&lt;/<tspan fill="#d29922">fes:Literal</tspan>&gt;</text>
  <text x="85" y="310" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;/<tspan fill="#f85149">fes:PropertyIsEqualTo</tspan>&gt;</text>
  <text x="85" y="345" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#f85149">fes:PropertyIsBetween</tspan>&gt;</text>
  <text x="105" y="370" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#d29922">fes:ValueReference</tspan>&gt;<tspan fill="#58a6ff" font-weight="bold">validFrom</tspan>&lt;/...&gt;</text>
  <text x="105" y="395" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#d29922">LowerBoundary</tspan>&gt;<tspan fill="#3fb950">2026-01-01</tspan>&lt;/...&gt;</text>
  <text x="105" y="420" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;<tspan fill="#d29922">UpperBoundary</tspan>&gt;<tspan fill="#3fb950">2026-12-31</tspan>&lt;/...&gt;</text>
  <text x="85" y="445" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;/<tspan fill="#f85149">fes:PropertyIsBetween</tspan>&gt;</text>
  <text x="65" y="470" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">&lt;/<tspan fill="#f85149">fes:Filter</tspan>&gt;</text>

  <!-- LOC badge -->
  <rect x="230" y="488" width="150" height="25" rx="12" fill="#0d419d"/>
  <text x="305" y="505" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="bold">135 lines · XXE-safe</text>

  <!-- Right side: dimensions + operators -->
  <text x="720" y="130" fill="#58a6ff" font-size="18" font-weight="bold">6 Filter Dimensions</text>

  <rect x="720" y="150" width="220" height="38" rx="6" fill="#21262d"/>
  <text x="830" y="174" text-anchor="middle" fill="#f0f6fc" font-size="14">eventScenario</text>
  <rect x="720" y="195" width="220" height="38" rx="6" fill="#21262d"/>
  <text x="830" y="219" text-anchor="middle" fill="#f0f6fc" font-size="14">airportHeliport</text>
  <rect x="720" y="240" width="220" height="38" rx="6" fill="#21262d"/>
  <text x="830" y="264" text-anchor="middle" fill="#f0f6fc" font-size="14">airspace</text>
  <rect x="720" y="285" width="220" height="38" rx="6" fill="#21262d"/>
  <text x="830" y="309" text-anchor="middle" fill="#f0f6fc" font-size="14">provider</text>
  <rect x="720" y="330" width="220" height="38" rx="6" fill="#21262d"/>
  <text x="830" y="354" text-anchor="middle" fill="#f0f6fc" font-size="14">validFrom</text>
  <rect x="720" y="375" width="220" height="38" rx="6" fill="#21262d"/>
  <text x="830" y="399" text-anchor="middle" fill="#f0f6fc" font-size="14">validTo</text>

  <text x="990" y="130" fill="#d29922" font-size="18" font-weight="bold">FES 2.0 Operators</text>

  <rect x="990" y="150" width="250" height="38" rx="6" fill="#21262d"/>
  <text x="1115" y="174" text-anchor="middle" fill="#d29922" font-size="13">PropertyIsEqualTo</text>
  <rect x="990" y="195" width="250" height="38" rx="6" fill="#21262d"/>
  <text x="1115" y="219" text-anchor="middle" fill="#d29922" font-size="13">PropertyIsBetween</text>
  <rect x="990" y="240" width="250" height="38" rx="6" fill="#21262d"/>
  <text x="1115" y="264" text-anchor="middle" fill="#d29922" font-size="13">PropertyIsGreaterThan</text>
  <rect x="990" y="285" width="250" height="38" rx="6" fill="#21262d"/>
  <text x="1115" y="309" text-anchor="middle" fill="#d29922" font-size="13">PropertyIsLessThan</text>

  <!-- Pagination section -->
  <rect x="720" y="440" width="520" height="80" rx="10" fill="#1c2333" stroke="#3fb950" stroke-width="1.5"/>
  <text x="730" y="468" fill="#3fb950" font-size="15" font-weight="bold">WFS 2.0 Pagination</text>
  <text x="730" y="492" fill="#8b949e" font-size="13" font-family="JetBrains Mono, monospace">startIndex=0 &amp; count=50</text>
  <text x="730" y="510" fill="#484f58" font-size="12">SQL-level pagination (no in-memory slicing) — prevents data choking</text>

  <!-- Bottom message -->
  <rect x="40" y="555" width="1200" height="40" rx="8" fill="#161b22"/>
  <text x="640" y="580" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">EUR SWIM Registry requires WFS GetFeature with FES 2.0 — this is full compliance</text>
</svg>

