<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="45" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="bold">Security Add-Ons — Custom Code, Not Configuration</text>
  <text x="640" y="72" text-anchor="middle" fill="#8b949e" font-size="14">Two custom Java add-ons built specifically for SWIM compliance</text>

  <!-- LEFT: Keycloak SWIM Role SPI -->
  <rect x="40" y="95" width="580" height="575" rx="14" fill="#1c2333" stroke="#a371f7" stroke-width="2"/>
  <text x="330" y="130" text-anchor="middle" fill="#a371f7" font-size="20" font-weight="bold">Keycloak SWIM Role SPI</text>
  <text x="330" y="155" text-anchor="middle" fill="#484f58" font-size="13">add-ons/keycloak-swim-role-spi/</text>

  <!-- Problem -->
  <text x="70" y="190" fill="#f85149" font-size="14" font-weight="bold">PROBLEM</text>
  <text x="70" y="210" fill="#8b949e" font-size="13">New ANSP user → manual AMQP role creation</text>
  <text x="70" y="228" fill="#8b949e" font-size="13">Manual = human error + deployment friction</text>

  <!-- Solution flow -->
  <text x="70" y="265" fill="#3fb950" font-size="14" font-weight="bold">SOLUTION — Automatic RBAC</text>

  <!-- Flow boxes -->
  <rect x="70" y="285" width="500" height="40" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
  <text x="320" y="310" text-anchor="middle" fill="#f0f6fc" font-size="14">1. Admin creates user in Keycloak</text>

  <!-- Arrow -->
  <line x1="320" y1="325" x2="320" y2="345" stroke="#a371f7" stroke-width="1.5"/>
  <polygon points="315,342 325,342 320,350" fill="#a371f7"/>

  <rect x="70" y="350" width="500" height="40" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
  <text x="320" y="375" text-anchor="middle" fill="#a371f7" font-size="14">2. swim-role-creator SPI fires (event listener)</text>

  <line x1="320" y1="390" x2="320" y2="410" stroke="#a371f7" stroke-width="1.5"/>
  <polygon points="315,407 325,407 320,415" fill="#a371f7"/>

  <rect x="70" y="415" width="500" height="50" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
  <text x="320" y="438" text-anchor="middle" fill="#f0f6fc" font-size="13">3. Creates role: {user}-swim-dnotam-v1-amq-role</text>
  <text x="320" y="456" text-anchor="middle" fill="#8b949e" font-size="12">on amq-broker client</text>

  <line x1="320" y1="465" x2="320" y2="485" stroke="#a371f7" stroke-width="1.5"/>
  <polygon points="315,482 325,482 320,490" fill="#a371f7"/>

  <rect x="70" y="490" width="500" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="515" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">4. User gets AMQP queue permissions instantly</text>

  <!-- Result -->
  <rect x="70" y="555" width="500" height="45" rx="8" fill="#0d419d" fill-opacity="0.3"/>
  <text x="320" y="580" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Zero manual RBAC. New user → immediate AMQP access.</text>
  <text x="320" y="598" text-anchor="middle" fill="#484f58" font-size="12">No IT ticket. No delay. No human error.</text>

  <!-- VERTICAL SEPARATOR -->
  <line x1="640" y1="105" x2="640" y2="660" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: AMQP JWT Auth -->
  <rect x="660" y="95" width="580" height="575" rx="14" fill="#1c2333" stroke="#d29922" stroke-width="2"/>
  <text x="950" y="130" text-anchor="middle" fill="#d29922" font-size="20" font-weight="bold">AMQP JWT Authentication</text>
  <text x="950" y="155" text-anchor="middle" fill="#484f58" font-size="13">BearerTokenLoginModule on Artemis</text>

  <!-- Problem -->
  <text x="690" y="190" fill="#f85149" font-size="14" font-weight="bold">PROBLEM</text>
  <text x="690" y="210" fill="#8b949e" font-size="13">SASL PLAIN = static credentials in config files</text>
  <text x="690" y="228" fill="#8b949e" font-size="13">Static passwords = security risk (SPEC-170 violation)</text>

  <!-- Solution: JAAS chain -->
  <text x="690" y="265" fill="#3fb950" font-size="14" font-weight="bold">SOLUTION — JAAS Login Chain (defense in depth)</text>

  <!-- Chain boxes -->
  <rect x="690" y="290" width="510" height="36" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <circle cx="715" cy="308" r="10" fill="#484f58"/><text x="715" y="313" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="bold">1</text>
  <text x="740" y="313" fill="#8b949e" font-size="13">PropertiesLogin — local admin bootstrap only</text>

  <rect x="690" y="336" width="510" height="36" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="715" cy="354" r="10" fill="#d29922"/><text x="715" y="359" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">2</text>
  <text x="740" y="359" fill="#d29922" font-size="13" font-weight="bold">DirectAccessGrants — Keycloak JWT validation</text>

  <rect x="690" y="382" width="510" height="36" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <circle cx="715" cy="400" r="10" fill="#58a6ff"/><text x="715" y="405" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">3</text>
  <text x="740" y="405" fill="#58a6ff" font-size="13">PrincipalConversion — JWT claims → broker roles</text>

  <rect x="690" y="428" width="510" height="36" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <circle cx="715" cy="446" r="10" fill="#484f58"/><text x="715" y="451" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="bold">4</text>
  <text x="740" y="451" fill="#8b949e" font-size="13">CertLogin — mTLS certificate fallback</text>

  <!-- Flow diagram -->
  <text x="690" y="500" fill="#3fb950" font-size="14" font-weight="bold">RESULT</text>

  <rect x="690" y="515" width="510" height="70" rx="8" fill="#161b22"/>
  <text x="700" y="540" fill="#f0f6fc" font-size="13">Consumer obtains JWT from Keycloak</text>
  <text x="700" y="558" fill="#f0f6fc" font-size="13">→ Presents JWT to Artemis AMQP port</text>
  <text x="700" y="576" fill="#f0f6fc" font-size="13">→ Artemis validates via Keycloak → grants queue access</text>

  <rect x="690" y="600" width="510" height="45" rx="8" fill="#0d419d" fill-opacity="0.3"/>
  <text x="945" y="623" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Zero static passwords. Tokens expire automatically.</text>
  <text x="945" y="641" text-anchor="middle" fill="#484f58" font-size="12">SPEC-170 compliant. Auditable. Revocable.</text>
</svg>

