<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="55" text-anchor="middle" fill="#f0f6fc" font-size="32" font-weight="bold">5 Interfaces = 1 SWIM Service</text>
  <text x="640" y="85" text-anchor="middle" fill="#8b949e" font-size="16">Implement these. Framework handles everything else.</text>

  <!-- SPI 1 -->
  <rect x="40" y="115" width="230" height="250" rx="12" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <circle cx="155" cy="155" r="24" fill="#0a2e0a" stroke="#3fb950" stroke-width="2"/>
  <text x="155" y="162" text-anchor="middle" fill="#3fb950" font-size="20" font-weight="bold">1</text>
  <text x="155" y="210" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold" font-family="JetBrains Mono, monospace">SwimSubscription</text>
  <text x="155" y="232" text-anchor="middle" fill="#3fb950" font-size="12" font-family="JetBrains Mono, monospace">&lt;E&gt;</text>
  <line x1="80" y1="250" x2="230" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="155" y="280" text-anchor="middle" fill="#f0f6fc" font-size="14">Filter logic</text>
  <text x="155" y="302" text-anchor="middle" fill="#f0f6fc" font-size="14">+ lifecycle</text>
  <text x="155" y="335" text-anchor="middle" fill="#484f58" font-size="11">Which events match</text>
  <text x="155" y="352" text-anchor="middle" fill="#484f58" font-size="11">this subscription?</text>

  <!-- SPI 2 -->
  <rect x="290" y="115" width="230" height="250" rx="12" fill="#1c2333" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="405" cy="155" r="24" fill="#0a1a2e" stroke="#58a6ff" stroke-width="2"/>
  <text x="405" y="162" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">2</text>
  <text x="405" y="210" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold" font-family="JetBrains Mono, monospace">SwimEventExtractor</text>
  <text x="405" y="232" text-anchor="middle" fill="#58a6ff" font-size="12" font-family="JetBrains Mono, monospace">&lt;T&gt;</text>
  <line x1="330" y1="250" x2="480" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="405" y="280" text-anchor="middle" fill="#f0f6fc" font-size="14">XML → structured</text>
  <text x="405" y="302" text-anchor="middle" fill="#f0f6fc" font-size="14">metadata</text>
  <text x="405" y="335" text-anchor="middle" fill="#484f58" font-size="11">Extract scenario,</text>
  <text x="405" y="352" text-anchor="middle" fill="#484f58" font-size="11">airport, timestamps</text>

  <!-- SPI 3 -->
  <rect x="540" y="115" width="230" height="250" rx="12" fill="#1c2333" stroke="#d29922" stroke-width="2"/>
  <circle cx="655" cy="155" r="24" fill="#2a1500" stroke="#d29922" stroke-width="2"/>
  <text x="655" y="162" text-anchor="middle" fill="#d29922" font-size="20" font-weight="bold">3</text>
  <text x="655" y="210" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold" font-family="JetBrains Mono, monospace">SwimPayloadValidator</text>
  <text x="655" y="232" text-anchor="middle" fill="#d29922" font-size="12"> </text>
  <line x1="580" y1="250" x2="730" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="655" y="280" text-anchor="middle" fill="#f0f6fc" font-size="14">XSD + business</text>
  <text x="655" y="302" text-anchor="middle" fill="#f0f6fc" font-size="14">validation</text>
  <text x="655" y="335" text-anchor="middle" fill="#484f58" font-size="11">Is this payload valid</text>
  <text x="655" y="352" text-anchor="middle" fill="#484f58" font-size="11">for my domain?</text>

  <!-- SPI 4 -->
  <rect x="790" y="115" width="230" height="250" rx="12" fill="#1c2333" stroke="#f85149" stroke-width="2"/>
  <circle cx="905" cy="155" r="24" fill="#2a0000" stroke="#f85149" stroke-width="2"/>
  <text x="905" y="162" text-anchor="middle" fill="#f85149" font-size="20" font-weight="bold">4</text>
  <text x="905" y="210" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold" font-family="JetBrains Mono, monospace">SwimOutboxRouter</text>
  <text x="905" y="232" text-anchor="middle" fill="#f85149" font-size="12"> </text>
  <line x1="830" y1="250" x2="980" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="905" y="280" text-anchor="middle" fill="#f0f6fc" font-size="14">Route to</text>
  <text x="905" y="302" text-anchor="middle" fill="#f0f6fc" font-size="14">destination (Kafka)</text>
  <text x="905" y="335" text-anchor="middle" fill="#484f58" font-size="11">Which topic gets</text>
  <text x="905" y="352" text-anchor="middle" fill="#484f58" font-size="11">this event?</text>

  <!-- SPI 5 -->
  <rect x="1040" y="115" width="200" height="250" rx="12" fill="#1c2333" stroke="#a371f7" stroke-width="2"/>
  <circle cx="1140" cy="155" r="24" fill="#1a0a2e" stroke="#a371f7" stroke-width="2"/>
  <text x="1140" y="162" text-anchor="middle" fill="#a371f7" font-size="20" font-weight="bold">5</text>
  <text x="1140" y="210" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="bold" font-family="JetBrains Mono, monospace">QueueProvisioning</text>
  <text x="1140" y="232" text-anchor="middle" fill="#a371f7" font-size="12" font-family="JetBrains Mono, monospace">Strategy</text>
  <line x1="1075" y1="250" x2="1205" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="1140" y="280" text-anchor="middle" fill="#f0f6fc" font-size="14">Queue creation</text>
  <text x="1140" y="302" text-anchor="middle" fill="#f0f6fc" font-size="14">+ RBAC</text>
  <text x="1140" y="335" text-anchor="middle" fill="#484f58" font-size="11">Provision broker</text>
  <text x="1140" y="352" text-anchor="middle" fill="#484f58" font-size="11">resources securely</text>

  <!-- Divider -->
  <text x="640" y="410" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">▼  Framework handles everything else  ▼</text>

  <!-- Framework features grid -->
  <rect x="40" y="435" width="1200" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="70" y="460" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="155" y="486" text-anchor="middle" fill="#8b949e" font-size="13">AMQP Connections</text>

  <rect x="260" y="460" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="345" y="486" text-anchor="middle" fill="#8b949e" font-size="13">mTLS (E2E)</text>

  <rect x="450" y="460" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="535" y="486" text-anchor="middle" fill="#8b949e" font-size="13">Heartbeats</text>

  <rect x="640" y="460" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="725" y="486" text-anchor="middle" fill="#8b949e" font-size="13">Reconciliation</text>

  <rect x="830" y="460" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="915" y="486" text-anchor="middle" fill="#8b949e" font-size="13">Idempotency</text>

  <rect x="1020" y="460" width="190" height="42" rx="6" fill="#21262d"/>
  <text x="1115" y="486" text-anchor="middle" fill="#8b949e" font-size="13">Dead Letter Queue</text>

  <!-- Row 2 -->
  <rect x="70" y="515" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="155" y="541" text-anchor="middle" fill="#8b949e" font-size="13">Retry + Timeout</text>

  <rect x="260" y="515" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="345" y="541" text-anchor="middle" fill="#8b949e" font-size="13">Bulkhead (250)</text>

  <rect x="450" y="515" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="535" y="541" text-anchor="middle" fill="#8b949e" font-size="13">Auto-Renewal</text>

  <rect x="640" y="515" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="725" y="541" text-anchor="middle" fill="#8b949e" font-size="13">Self-Healing</text>

  <rect x="830" y="515" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="915" y="541" text-anchor="middle" fill="#8b949e" font-size="13">Inbox/Outbox</text>

  <rect x="1020" y="515" width="190" height="42" rx="6" fill="#21262d"/>
  <text x="1115" y="541" text-anchor="middle" fill="#8b949e" font-size="13">XSD Validation</text>

  <!-- Row 3 -->
  <rect x="70" y="570" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="155" y="596" text-anchor="middle" fill="#8b949e" font-size="13">OpenTelemetry</text>

  <rect x="260" y="570" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="345" y="596" text-anchor="middle" fill="#8b949e" font-size="13">Health Checks</text>

  <rect x="450" y="570" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="535" y="596" text-anchor="middle" fill="#8b949e" font-size="13">Prometheus</text>

  <rect x="640" y="570" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="725" y="596" text-anchor="middle" fill="#8b949e" font-size="13">Circuit Breaker</text>

  <rect x="830" y="570" width="170" height="42" rx="6" fill="#21262d"/>
  <text x="915" y="596" text-anchor="middle" fill="#8b949e" font-size="13">Subscription Expiry</text>

  <rect x="1020" y="570" width="190" height="42" rx="6" fill="#21262d"/>
  <text x="1115" y="596" text-anchor="middle" fill="#8b949e" font-size="13">Multi-Provider</text>

  <!-- Count -->
  <text x="640" y="655" text-anchor="middle" fill="#484f58" font-size="14">You implement 5. Framework provides 18+ infrastructure capabilities.</text>
</svg>

