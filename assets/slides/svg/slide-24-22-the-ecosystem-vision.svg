<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" font-family="Red Hat Text, sans-serif">
  <rect width="1100" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="bold">The Container Sharing Ecosystem</text>
  <text x="550" y="58" text-anchor="middle" fill="#8b949e" font-size="14">One entity develops. All benefit.</text>

  <!-- Developers row -->
  <text x="550" y="95" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">DEVELOPERS (Implement 5 SPIs)</text>

  <rect x="50" y="110" width="300" height="100" rx="8" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <text x="200" y="138" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Entity A (e.g., NAV Portugal)</text>
  <text x="200" y="160" text-anchor="middle" fill="#f0f6fc" font-size="12">Develops: DNOTAM Module</text>
  <text x="200" y="180" text-anchor="middle" fill="#8b949e" font-size="11">5 SPIs + domain logic only</text>
  <text x="200" y="198" text-anchor="middle" fill="#8b949e" font-size="10">~50 classes (vs ~130 from scratch)</text>

  <rect x="400" y="110" width="300" height="100" rx="8" fill="#1c2333" stroke="#d29922" stroke-width="2"/>
  <text x="550" y="138" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">Entity B (e.g., Austro Control)</text>
  <text x="550" y="160" text-anchor="middle" fill="#f0f6fc" font-size="12">Develops: Arrival Sequence</text>
  <text x="550" y="180" text-anchor="middle" fill="#8b949e" font-size="11">5 SPIs + domain logic only</text>
  <text x="550" y="198" text-anchor="middle" fill="#8b949e" font-size="10">~50 classes (vs ~130 from scratch)</text>

  <rect x="750" y="110" width="300" height="100" rx="8" fill="#1c2333" stroke="#a371f7" stroke-width="2"/>
  <text x="900" y="138" text-anchor="middle" fill="#a371f7" font-size="14" font-weight="bold">Entity C (e.g., LFV Sweden)</text>
  <text x="900" y="160" text-anchor="middle" fill="#f0f6fc" font-size="12">Develops: MET Services</text>
  <text x="900" y="180" text-anchor="middle" fill="#8b949e" font-size="11">5 SPIs + domain logic only</text>
  <text x="900" y="198" text-anchor="middle" fill="#8b949e" font-size="10">~50 classes (vs ~130 from scratch)</text>

  <!-- Arrows down to registry -->
  <line x1="200" y1="215" x2="200" y2="260" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGr)"/>
  <line x1="550" y1="215" x2="550" y2="260" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowOr)"/>
  <line x1="900" y1="215" x2="900" y2="260" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrowPu)"/>

  <!-- Container Registry -->
  <rect x="100" y="265" width="900" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="295" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Container Registry (Quay.io / Internal)</text>
  <text x="550" y="318" text-anchor="middle" fill="#8b949e" font-size="12">swim-dnotam-consumer:latest    swim-ed254-provider:latest    swim-met-consumer:latest</text>

  <!-- Arrows down to deployers -->
  <line x1="250" y1="340" x2="250" y2="390" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBl)"/>
  <line x1="550" y1="340" x2="550" y2="390" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBl)"/>
  <line x1="850" y1="340" x2="850" y2="390" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBl)"/>

  <!-- Deployers row -->
  <text x="550" y="385" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">DEPLOYERS (1 CR = Full Stack)</text>

  <rect x="80" y="400" width="260" height="80" rx="8" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <text x="210" y="425" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">Finland</text>
  <text x="210" y="448" text-anchor="middle" fill="#8b949e" font-size="11">Deploys DNOTAM Consumer</text>
  <text x="210" y="466" text-anchor="middle" fill="#8b949e" font-size="10">(from Portugal's container)</text>

  <rect x="420" y="400" width="260" height="80" rx="8" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <text x="550" y="425" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">Ireland</text>
  <text x="550" y="448" text-anchor="middle" fill="#8b949e" font-size="11">Deploys Arrival Sequence</text>
  <text x="550" y="466" text-anchor="middle" fill="#8b949e" font-size="10">(from Austria's container)</text>

  <rect x="760" y="400" width="260" height="80" rx="8" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <text x="890" y="425" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">Slovenia</text>
  <text x="890" y="448" text-anchor="middle" fill="#8b949e" font-size="11">Deploys MET Services</text>
  <text x="890" y="466" text-anchor="middle" fill="#8b949e" font-size="10">(from Sweden's container)</text>

  <!-- Math callout -->
  <rect x="100" y="500" width="900" height="35" rx="6" fill="#0d419d"/>
  <text x="550" y="523" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">Framework = ~130 classes   |   Each new service = ~50 classes (5 SPIs)   |   60% less code per service</text>

  <defs>
    <marker id="arrowGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
    <marker id="arrowOr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker>
    <marker id="arrowPu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7"/></marker>
    <marker id="arrowBl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker>
  </defs>
</svg>

