<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="45" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="bold">End-to-End Distributed Tracing</text>
  <text x="640" y="70" text-anchor="middle" fill="#8b949e" font-size="14">OpenTelemetry · Tempo · Grafana</text>

  <!-- Provider trace block -->
  <rect x="40" y="90" width="1200" height="230" rx="10" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <text x="70" y="118" fill="#f85149" font-size="16" font-weight="bold">swim-dnotam-provider</text>

  <!-- Span 1 -->
  <rect x="80" y="135" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="90" y="140" width="900" height="22" rx="3" fill="#f85149" fill-opacity="0.3"/>
  <text x="100" y="156" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">dnotam.provider.kafka.consume</text>
  <text x="810" y="156" fill="#8b949e" font-size="11">size: 15,234 bytes</text>
  <text x="1020" y="156" fill="#484f58" font-size="11">45ms</text>

  <!-- Span 2 (nested) -->
  <rect x="80" y="172" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="160" y="177" width="700" height="22" rx="3" fill="#d29922" fill-opacity="0.3"/>
  <text x="170" y="193" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">  dnotam.provider.process</text>
  <text x="610" y="193" fill="#8b949e" font-size="11">eventId: EVT-001 · scenario: RWY.CLS · airport: LPPT</text>
  <text x="1020" y="193" fill="#484f58" font-size="11">32ms</text>

  <!-- Span 3 (nested deeper) -->
  <rect x="80" y="209" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="240" y="214" width="500" height="22" rx="3" fill="#58a6ff" fill-opacity="0.3"/>
  <text x="250" y="230" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">    dnotam.provider.outbox.deliver</text>
  <text x="1020" y="230" fill="#484f58" font-size="11">18ms</text>

  <!-- Span 4 -->
  <rect x="80" y="246" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="300" y="251" width="380" height="22" rx="3" fill="#3fb950" fill-opacity="0.3"/>
  <text x="310" y="267" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">      dnotam.provider.outbox.process</text>
  <text x="720" y="267" fill="#3fb950" font-size="11" font-weight="bold">delivered: 2, failed: 0</text>
  <text x="1020" y="267" fill="#484f58" font-size="11">12ms</text>

  <!-- AMQP arrow -->
  <rect x="580" y="325" width="120" height="28" rx="14" fill="#0d419d"/>
  <text x="640" y="344" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="bold">AMQP 1.0</text>

  <!-- Consumer trace block -->
  <rect x="40" y="365" width="1200" height="230" rx="10" fill="#1c2333" stroke="#3fb950" stroke-width="1.5"/>
  <text x="70" y="393" fill="#3fb950" font-size="16" font-weight="bold">swim-dnotam-consumer</text>

  <!-- Consumer spans -->
  <rect x="80" y="410" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="90" y="415" width="850" height="22" rx="3" fill="#3fb950" fill-opacity="0.3"/>
  <text x="100" y="431" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">dnotam.consumer.inbox.receive</text>
  <text x="570" y="431" fill="#8b949e" font-size="11">sub: sub-001 · queue: DNOTAM.v1.client01.sub-001</text>
  <text x="1020" y="431" fill="#484f58" font-size="11">38ms</text>

  <rect x="80" y="447" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="160" y="452" width="650" height="22" rx="3" fill="#58a6ff" fill-opacity="0.3"/>
  <text x="170" y="468" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">  dnotam.consumer.inbox.process</text>
  <text x="620" y="468" fill="#8b949e" font-size="11">messages: 1, processed: 1, failed: 0</text>
  <text x="1020" y="468" fill="#484f58" font-size="11">28ms</text>

  <rect x="80" y="484" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="240" y="489" width="450" height="22" rx="3" fill="#d29922" fill-opacity="0.3"/>
  <text x="250" y="505" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">    dnotam.consumer.event.process</text>
  <text x="600" y="505" fill="#8b949e" font-size="11">EVT-001 · RWY.CLS · LPPT</text>
  <text x="1020" y="505" fill="#484f58" font-size="11">15ms</text>

  <rect x="80" y="521" width="1100" height="32" rx="4" fill="#0d1117"/>
  <rect x="300" y="526" width="320" height="22" rx="3" fill="#f85149" fill-opacity="0.3"/>
  <text x="310" y="542" fill="#f0f6fc" font-size="12" font-family="JetBrains Mono, monospace">      dnotam.consumer.kafka.send</text>
  <text x="680" y="542" fill="#3fb950" font-size="11" font-weight="bold">topic: dnotam-events-closure</text>
  <text x="1020" y="542" fill="#484f58" font-size="11">5ms</text>

  <!-- Bottom tools -->
  <rect x="60" y="620" width="360" height="55" rx="8" fill="#21262d"/>
  <text x="240" y="645" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Tempo</text>
  <text x="240" y="663" text-anchor="middle" fill="#484f58" font-size="11">Search by eventId, scenario, airport</text>

  <rect x="460" y="620" width="360" height="55" rx="8" fill="#21262d"/>
  <text x="640" y="645" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">Grafana</text>
  <text x="640" y="663" text-anchor="middle" fill="#484f58" font-size="11">Throughput, latency, delivery rates</text>

  <rect x="860" y="620" width="360" height="55" rx="8" fill="#21262d"/>
  <text x="1040" y="645" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">TraceQL</text>
  <text x="1040" y="663" text-anchor="middle" fill="#484f58" font-size="11">Find failures, duplicates, DLQ events</text>
</svg>

