<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <!-- Big check -->
  <circle cx="640" cy="60" r="30" fill="#0a2e0a" stroke="#3fb950" stroke-width="2"/>
  <text x="640" y="70" text-anchor="middle" fill="#3fb950" font-size="28" font-weight="bold">✓</text>
  <text x="640" y="115" text-anchor="middle" fill="#f0f6fc" font-size="32" font-weight="bold">Running on OpenShift 4.18</text>
  <rect x="460" y="130" width="360" height="28" rx="14" fill="#0a2e0a" stroke="#3fb950" stroke-width="1"/>
  <text x="640" y="149" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">v0.19.0-dnotam-e2e-validated · April 6, 2026</text>

  <!-- Component table -->
  <rect x="100" y="185" width="1080" height="45" rx="8" fill="#0d419d"/>
  <text x="350" y="213" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">Component</text>
  <text x="730" y="213" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">Namespace</text>
  <text x="1050" y="213" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">Status</text>

  <!-- Row 1 -->
  <rect x="100" y="235" width="1080" height="55" rx="0" fill="#1c2333"/>
  <text x="140" y="260" fill="#f0f6fc" font-size="15">Consumer Validator (Mock AISP)</text>
  <text x="140" y="278" fill="#484f58" font-size="11">Heartbeats (15s) + DNOTAM AIXM events</text>
  <text x="730" y="268" text-anchor="middle" fill="#8b949e" font-size="13" font-family="JetBrains Mono, monospace">swim-external-provider</text>
  <circle cx="1050" cy="262" r="10" fill="#3fb950"/><text x="1050" y="267" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">✓</text>

  <!-- Row 2 -->
  <rect x="100" y="295" width="1080" height="55" rx="0" fill="#161b22"/>
  <text x="140" y="320" fill="#f0f6fc" font-size="15">DNOTAM Consumer (ANSP)</text>
  <text x="140" y="338" fill="#484f58" font-size="11">Receiving heartbeats · processing events · Kafka routing (6 topics)</text>
  <text x="730" y="328" text-anchor="middle" fill="#8b949e" font-size="13" font-family="JetBrains Mono, monospace">swim-sandbox</text>
  <circle cx="1050" cy="322" r="10" fill="#3fb950"/><text x="1050" y="327" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">✓</text>

  <!-- Row 3 -->
  <rect x="100" y="355" width="1080" height="55" rx="0" fill="#1c2333"/>
  <text x="140" y="380" fill="#f0f6fc" font-size="15">Artemis Broker (mTLS)</text>
  <text x="140" y="398" fill="#484f58" font-size="11">AMQP 1.0 over TLS · mTLS authentication · JWT via Keycloak</text>
  <text x="730" y="388" text-anchor="middle" fill="#8b949e" font-size="13" font-family="JetBrains Mono, monospace">swim-external-provider</text>
  <circle cx="1050" cy="382" r="10" fill="#3fb950"/><text x="1050" y="387" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">✓</text>

  <!-- Row 4 -->
  <rect x="100" y="415" width="1080" height="55" rx="8" fill="#161b22"/>
  <text x="140" y="440" fill="#f0f6fc" font-size="15">Kubernetes Operator</text>
  <text x="140" y="458" fill="#484f58" font-size="11">Manages CRDs · deploys full stack via single CR · OLM integration</text>
  <text x="730" y="448" text-anchor="middle" fill="#8b949e" font-size="13" font-family="JetBrains Mono, monospace">swim-operator-system</text>
  <circle cx="1050" cy="442" r="10" fill="#3fb950"/><text x="1050" y="447" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">✓</text>

  <!-- Statement -->
  <rect x="100" y="510" width="1080" height="120" rx="12" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <text x="640" y="548" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="300">This is not a PoC. This is not a local demo.</text>
  <text x="640" y="585" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">This is running on a real cluster with</text>
  <text x="640" y="615" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">production-grade security, observability, and CI/CD.</text>
</svg>

