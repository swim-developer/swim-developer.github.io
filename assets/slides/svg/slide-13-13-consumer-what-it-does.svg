<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="50" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="bold">Consumer (ANSP Role)</text>
  <text x="640" y="78" text-anchor="middle" fill="#8b949e" font-size="16">Self-Healing Event Processing</text>

  <!-- Card 1: Subscription Lifecycle -->
  <rect x="40" y="105" width="380" height="170" rx="12" fill="#1c2333" stroke="#f85149" stroke-width="2"/>
  <rect x="60" y="125" width="40" height="40" rx="8" fill="#2a0000"/>
  <text x="80" y="152" text-anchor="middle" fill="#f85149" font-size="18" font-weight="bold">!</text>
  <text x="115" y="140" fill="#f0f6fc" font-size="17" font-weight="bold">Subscription Lifecycle</text>
  <text x="115" y="162" fill="#f85149" font-size="13" font-weight="bold">CRITICAL: no message loss</text>
  <text x="70" y="200" fill="#484f58" font-size="13">1. Persist to MongoDB</text>
  <text x="70" y="222" fill="#484f58" font-size="13">2. Register AMQP consumer</text>
  <text x="70" y="244" fill="#f85149" font-size="13" font-weight="bold">3. THEN activate (ACTIVE)</text>

  <!-- Card 2: Self-Healing -->
  <rect x="450" y="105" width="380" height="170" rx="12" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <rect x="470" y="125" width="40" height="40" rx="8" fill="#0a2e0a"/>
  <text x="490" y="152" text-anchor="middle" fill="#3fb950" font-size="18">♻</text>
  <text x="525" y="140" fill="#f0f6fc" font-size="17" font-weight="bold">Self-Healing Recovery</text>
  <text x="525" y="162" fill="#8b949e" font-size="13">Zero manual intervention</text>
  <text x="480" y="200" fill="#484f58" font-size="13">Heartbeat timeout (30s)</text>
  <text x="480" y="222" fill="#484f58" font-size="13">→ Query provider status</text>
  <text x="480" y="244" fill="#484f58" font-size="13">→ Recreate if 404/TERMINATED</text>

  <!-- Card 3: Business Intent -->
  <rect x="860" y="105" width="380" height="170" rx="12" fill="#1c2333" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="880" y="125" width="40" height="40" rx="8" fill="#0d419d"/>
  <text x="900" y="152" text-anchor="middle" fill="#f0f6fc" font-size="18">🎯</text>
  <text x="935" y="140" fill="#f0f6fc" font-size="17" font-weight="bold">Business Intent Routing</text>
  <text x="935" y="162" fill="#8b949e" font-size="13">6 Kafka topics by impact</text>
  <text x="890" y="200" fill="#484f58" font-size="13">closure · restriction · surface</text>
  <text x="890" y="222" fill="#484f58" font-size="13">airspace · hazards · others</text>
  <text x="890" y="244" fill="#484f58" font-size="13">Operational, not physical</text>

  <!-- Card 4: Reconciliation -->
  <rect x="40" y="300" width="380" height="170" rx="12" fill="#1c2333" stroke="#d29922" stroke-width="1.5"/>
  <rect x="60" y="320" width="40" height="40" rx="8" fill="#2a1500"/>
  <text x="80" y="347" text-anchor="middle" fill="#d29922" font-size="18">🔄</text>
  <text x="115" y="335" fill="#f0f6fc" font-size="17" font-weight="bold">Reconciliation</text>
  <text x="115" y="357" fill="#8b949e" font-size="13">Startup + every 10 seconds</text>
  <text x="70" y="395" fill="#484f58" font-size="13">Compare desired vs actual</text>
  <text x="70" y="417" fill="#484f58" font-size="13">Create missing subscriptions</text>
  <text x="70" y="439" fill="#484f58" font-size="13">Re-register AMQP consumers</text>

  <!-- Card 5: Auto-Renewal -->
  <rect x="450" y="300" width="380" height="170" rx="12" fill="#1c2333" stroke="#a371f7" stroke-width="1.5"/>
  <rect x="470" y="320" width="40" height="40" rx="8" fill="#1a0a2e"/>
  <text x="490" y="347" text-anchor="middle" fill="#a371f7" font-size="18">⏳</text>
  <text x="525" y="335" fill="#f0f6fc" font-size="17" font-weight="bold">Auto-Renewal</text>
  <text x="525" y="357" fill="#8b949e" font-size="13">TTL check every 5 minutes</text>
  <text x="480" y="395" fill="#484f58" font-size="13">Detect expiry within 1 hour</text>
  <text x="480" y="417" fill="#484f58" font-size="13">PUT /renew → extend 30 days</text>
  <text x="480" y="439" fill="#484f58" font-size="13">Prevents unplanned expiration</text>

  <!-- Card 6: Fault Tolerance -->
  <rect x="860" y="300" width="380" height="170" rx="12" fill="#1c2333" stroke="#e3b341" stroke-width="1.5"/>
  <rect x="880" y="320" width="40" height="40" rx="8" fill="#1a1500"/>
  <text x="900" y="347" text-anchor="middle" fill="#e3b341" font-size="18">🛡</text>
  <text x="935" y="335" fill="#f0f6fc" font-size="17" font-weight="bold">Fault Tolerance</text>
  <text x="935" y="357" fill="#8b949e" font-size="13">MicroProfile Fault Tolerance</text>
  <text x="890" y="395" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">@Retry(3, delay=1s, jitter)</text>
  <text x="890" y="417" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">@Timeout(10s)</text>
  <text x="890" y="439" fill="#484f58" font-size="13" font-family="JetBrains Mono, monospace">@Bulkhead(250)</text>

  <!-- Bottom stats -->
  <rect x="40" y="510" width="1200" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="553" text-anchor="middle" fill="#58a6ff" font-size="24" font-weight="900">56 classes (DNOTAM)</text>
  <line x1="640" y1="520" x2="640" y2="570" stroke="#30363d" stroke-width="1"/>
  <text x="960" y="553" text-anchor="middle" fill="#d29922" font-size="24" font-weight="900">52 classes (ED-254)</text>
</svg>

