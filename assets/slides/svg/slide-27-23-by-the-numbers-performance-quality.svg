<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="45" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="bold">By the Numbers</text>

  <!-- LEFT: Performance KPIs -->
  <rect x="40" y="80" width="580" height="590" rx="14" fill="#1c2333" stroke="#3fb950" stroke-width="1.5"/>
  <text x="330" y="115" text-anchor="middle" fill="#3fb950" font-size="18" font-weight="bold">Measured Performance</text>

  <!-- KPI Cards -->
  <rect x="70" y="140" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="195" y="170" text-anchor="middle" fill="#3fb950" font-size="36" font-weight="bold">~9ms</text>
  <text x="195" y="195" text-anchor="middle" fill="#8b949e" font-size="12">avg message processing</text>
  <text x="195" y="210" text-anchor="middle" fill="#484f58" font-size="10">AMQP → Inbox → Kafka</text>

  <rect x="340" y="140" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="465" y="170" text-anchor="middle" fill="#58a6ff" font-size="36" font-weight="bold">~90%</text>
  <text x="465" y="195" text-anchor="middle" fill="#8b949e" font-size="12">GZIP compression</text>
  <text x="465" y="210" text-anchor="middle" fill="#484f58" font-size="10">AIXM XML payloads</text>

  <rect x="70" y="235" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="195" y="265" text-anchor="middle" fill="#d29922" font-size="36" font-weight="bold">450+</text>
  <text x="195" y="290" text-anchor="middle" fill="#8b949e" font-size="12">tests (unit + integration)</text>
  <text x="195" y="305" text-anchor="middle" fill="#484f58" font-size="10">Testcontainers: real deps</text>

  <rect x="340" y="235" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="465" y="265" text-anchor="middle" fill="#f85149" font-size="36" font-weight="bold">250</text>
  <text x="465" y="290" text-anchor="middle" fill="#8b949e" font-size="12">bulkhead concurrency</text>
  <text x="465" y="305" text-anchor="middle" fill="#484f58" font-size="10">prevents thread starvation</text>

  <rect x="70" y="330" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="195" y="360" text-anchor="middle" fill="#a371f7" font-size="36" font-weight="bold">15s</text>
  <text x="195" y="385" text-anchor="middle" fill="#8b949e" font-size="12">heartbeat interval</text>
  <text x="195" y="400" text-anchor="middle" fill="#484f58" font-size="10">per-subscription watchdog</text>

  <rect x="340" y="330" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="465" y="360" text-anchor="middle" fill="#a371f7" font-size="36" font-weight="bold">19</text>
  <text x="465" y="385" text-anchor="middle" fill="#8b949e" font-size="12">ADRs documented</text>
  <text x="465" y="400" text-anchor="middle" fill="#484f58" font-size="10">every decision recorded</text>

  <rect x="70" y="425" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="195" y="455" text-anchor="middle" fill="#EE0000" font-size="36" font-weight="bold">7</text>
  <text x="195" y="480" text-anchor="middle" fill="#8b949e" font-size="12">Tekton CI/CD pipelines</text>
  <text x="195" y="495" text-anchor="middle" fill="#484f58" font-size="10">git push → deploy in 15 min</text>

  <rect x="340" y="425" width="250" height="80" rx="8" fill="#161b22"/>
  <text x="465" y="455" text-anchor="middle" fill="#EE0000" font-size="36" font-weight="bold">130+</text>
  <text x="465" y="480" text-anchor="middle" fill="#8b949e" font-size="12">framework classes</text>
  <text x="465" y="495" text-anchor="middle" fill="#484f58" font-size="10">3 modules: core/consumer/provider</text>

  <!-- Bottom highlight -->
  <rect x="70" y="520" width="520" height="45" rx="8" fill="#0d419d" fill-opacity="0.3"/>
  <text x="330" y="548" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Measured. Not claimed. Every number is reproducible.</text>

  <!-- RIGHT: Code Comparison -->
  <rect x="660" y="80" width="580" height="590" rx="14" fill="#1c2333" stroke="#d29922" stroke-width="1.5"/>
  <text x="950" y="115" text-anchor="middle" fill="#d29922" font-size="18" font-weight="bold">Framework Impact: New Service</text>

  <!-- Without framework -->
  <rect x="690" y="140" width="520" height="200" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="950" y="170" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">WITHOUT framework</text>
  <text x="950" y="210" text-anchor="middle" fill="#f0f6fc" font-size="56" font-weight="900">2,500+</text>
  <text x="950" y="240" text-anchor="middle" fill="#8b949e" font-size="14">lines of code</text>
  <text x="950" y="270" text-anchor="middle" fill="#484f58" font-size="12">AMQP + mTLS + Heartbeat + Reconciliation + DLQ + Health + Tracing</text>
  <text x="950" y="290" text-anchor="middle" fill="#484f58" font-size="12">+ Subscriptions + Kafka + XSD validation + Error handling + ...</text>

  <!-- Arrow -->
  <text x="950" y="365" text-anchor="middle" fill="#3fb950" font-size="30">↓</text>

  <!-- With framework -->
  <rect x="690" y="380" width="520" height="200" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="950" y="410" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">WITH framework</text>
  <text x="950" y="450" text-anchor="middle" fill="#f0f6fc" font-size="56" font-weight="900">700-900</text>
  <text x="950" y="480" text-anchor="middle" fill="#8b949e" font-size="14">lines of domain code</text>
  <text x="950" y="510" text-anchor="middle" fill="#484f58" font-size="12">1 SwimEventExtractor + 1 SwimOutboxRouter + 1 Validator</text>
  <text x="950" y="530" text-anchor="middle" fill="#484f58" font-size="12">+ domain entities + REST resources + properties</text>

  <!-- Reduction badge -->
  <rect x="860" y="600" width="180" height="50" rx="25" fill="#3fb950" fill-opacity="0.2" stroke="#3fb950" stroke-width="2"/>
  <text x="950" y="632" text-anchor="middle" fill="#3fb950" font-size="24" font-weight="bold">65-70% less</text>
</svg>

