<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Red Hat Text, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#0d1117"/>

  <!-- Framework box -->
  <rect x="150" y="40" width="900" height="200" rx="12" fill="#1c2333" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="75" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="bold">SWIM Framework (Reusable)</text>

  <!-- Core module -->
  <rect x="180" y="95" width="260" height="120" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="310" y="120" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">Core (91 classes)</text>
  <text x="310" y="145" text-anchor="middle" fill="#8b949e" font-size="12">5 SPIs</text>
  <text x="310" y="163" text-anchor="middle" fill="#8b949e" font-size="12">Security &amp; Validation</text>
  <text x="310" y="181" text-anchor="middle" fill="#8b949e" font-size="12">Multi-Provider Support</text>
  <text x="310" y="199" text-anchor="middle" fill="#8b949e" font-size="12">Health &amp; Observability</text>

  <!-- Consumer module -->
  <rect x="470" y="95" width="260" height="120" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="600" y="120" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">Consumer (30 classes)</text>
  <text x="600" y="145" text-anchor="middle" fill="#8b949e" font-size="12">Inbox / Outbox Pattern</text>
  <text x="600" y="163" text-anchor="middle" fill="#8b949e" font-size="12">Heartbeat Monitoring</text>
  <text x="600" y="181" text-anchor="middle" fill="#8b949e" font-size="12">Reconciliation</text>
  <text x="600" y="199" text-anchor="middle" fill="#8b949e" font-size="12">Renewal &amp; Expiry</text>

  <!-- Provider module -->
  <rect x="760" y="95" width="260" height="120" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="890" y="120" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">Provider (11 classes)</text>
  <text x="890" y="145" text-anchor="middle" fill="#8b949e" font-size="12">AMQP Publisher</text>
  <text x="890" y="163" text-anchor="middle" fill="#8b949e" font-size="12">Heartbeat Generator</text>
  <text x="890" y="181" text-anchor="middle" fill="#8b949e" font-size="12">Subscription Expiry</text>
  <text x="890" y="199" text-anchor="middle" fill="#8b949e" font-size="12">Queue Provisioning</text>

  <!-- Arrows down -->
  <line x1="310" y1="250" x2="310" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="600" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="250" x2="890" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Service boxes -->
  <!-- DNOTAM -->
  <rect x="170" y="330" width="280" height="140" rx="10" fill="#1c2333" stroke="#f85149" stroke-width="2"/>
  <text x="310" y="360" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">DNOTAM</text>
  <text x="310" y="385" text-anchor="middle" fill="#f0f6fc" font-size="13">Provider (45 classes)</text>
  <text x="310" y="405" text-anchor="middle" fill="#f0f6fc" font-size="13">Consumer (56 classes)</text>
  <text x="310" y="430" text-anchor="middle" fill="#8b949e" font-size="11">AIXM 5.1.1 · 6 Kafka topics</text>
  <text x="310" y="450" text-anchor="middle" fill="#8b949e" font-size="11">OGC Filter Parser · WFS 2.0</text>

  <!-- ED-254 -->
  <rect x="460" y="330" width="280" height="140" rx="10" fill="#1c2333" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="360" text-anchor="middle" fill="#d29922" font-size="16" font-weight="bold">ED-254 (Arrival Sequence)</text>
  <text x="600" y="385" text-anchor="middle" fill="#f0f6fc" font-size="13">Provider (38 classes)</text>
  <text x="600" y="405" text-anchor="middle" fill="#f0f6fc" font-size="13">Consumer (52 classes)</text>
  <text x="600" y="430" text-anchor="middle" fill="#8b949e" font-size="11">FIXM 4.3 · Speed Advisories</text>
  <text x="600" y="450" text-anchor="middle" fill="#8b949e" font-size="11">Multi-Provider AMAN</text>

  <!-- MET (future) -->
  <rect x="750" y="330" width="280" height="140" rx="10" fill="#1c2333" stroke="#484f58" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="890" y="360" text-anchor="middle" fill="#484f58" font-size="16" font-weight="bold">MET / IWXXM (Future)</text>
  <text x="890" y="390" text-anchor="middle" fill="#484f58" font-size="13">Same framework</text>
  <text x="890" y="410" text-anchor="middle" fill="#484f58" font-size="13">Different SPI implementations</text>
  <text x="890" y="440" text-anchor="middle" fill="#484f58" font-size="11">METAR · TAF · SIGMET</text>

  <!-- Infrastructure bar -->
  <rect x="150" y="520" width="900" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="555" text-anchor="middle" fill="#8b949e" font-size="14">OpenShift · Artemis (AMQP 1.0) · Kafka (Strimzi) · Keycloak (JWT/OIDC) · cert-manager (mTLS)</text>
  <text x="600" y="580" text-anchor="middle" fill="#8b949e" font-size="14">PostgreSQL · MongoDB · OpenTelemetry · Prometheus · Grafana · Tempo · Loki</text>

  <!-- Operator badge -->
  <rect x="150" y="620" width="900" height="50" rx="10" fill="#0d419d" stroke="#58a6ff" stroke-width="1"/>
  <text x="600" y="652" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="bold">Kubernetes Operator — One CR deploys entire stack in 7 minutes</text>
</svg>

