<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <text x="640" y="45" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="bold">ED-254 — 100% Mandatory Message Types</text>
  <text x="640" y="72" text-anchor="middle" fill="#8b949e" font-size="14">EUROCAE ED-254 Arrival Sequence Service · FIXM 4.3</text>

  <!-- Message Type Cards -->
  <rect x="40" y="100" width="590" height="110" rx="12" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <circle cx="80" cy="155" r="18" fill="#3fb950"/><text x="80" y="161" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">✓</text>
  <text x="115" y="140" fill="#f0f6fc" font-size="18" font-weight="bold">ArrivalDataType</text>
  <text x="115" y="162" fill="#8b949e" font-size="13">Primary arrival sequence data — aircraft position, ETA, sequence number</text>
  <text x="115" y="182" fill="#484f58" font-size="11" font-family="JetBrains Mono, monospace">TSATC_MESSAGE_TYPE=ArrivalDataType</text>

  <rect x="650" y="100" width="590" height="110" rx="12" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <circle cx="690" cy="155" r="18" fill="#3fb950"/><text x="690" y="161" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">✓</text>
  <text x="725" y="140" fill="#f0f6fc" font-size="18" font-weight="bold">AMANProviderExceptionType</text>
  <text x="725" y="162" fill="#8b949e" font-size="13">Provider-side errors — degraded data, system faults</text>
  <text x="725" y="182" fill="#484f58" font-size="11" font-family="JetBrains Mono, monospace">TSATC_MESSAGE_TYPE=AMANProviderExceptionType</text>

  <rect x="40" y="225" width="590" height="110" rx="12" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <circle cx="80" cy="280" r="18" fill="#3fb950"/><text x="80" y="286" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">✓</text>
  <text x="115" y="265" fill="#f0f6fc" font-size="18" font-weight="bold">HeartbeatTechnicalMessage</text>
  <text x="115" y="287" fill="#8b949e" font-size="13">Liveness detection — 15s interval, sequence counter, zombie detection</text>
  <text x="115" y="307" fill="#484f58" font-size="11" font-family="JetBrains Mono, monospace">TSATC_MESSAGE_TYPE=HeartbeatTechnicalMessage</text>

  <rect x="650" y="225" width="590" height="110" rx="12" fill="#1c2333" stroke="#3fb950" stroke-width="2"/>
  <circle cx="690" cy="280" r="18" fill="#3fb950"/><text x="690" y="286" text-anchor="middle" fill="#0d1117" font-size="16" font-weight="bold">✓</text>
  <text x="725" y="265" fill="#f0f6fc" font-size="18" font-weight="bold">SubscriptionTechnicalMessage</text>
  <text x="725" y="287" fill="#8b949e" font-size="13">Subscription lifecycle — state transitions, confirmations</text>
  <text x="725" y="307" fill="#484f58" font-size="11" font-family="JetBrains Mono, monospace">TSATC_MESSAGE_TYPE=SubscriptionTechnicalMessage</text>

  <!-- Result badge -->
  <rect x="440" y="355" width="400" height="45" rx="22" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
  <text x="640" y="383" text-anchor="middle" fill="#3fb950" font-size="18" font-weight="bold">4/4 Mandatory Types — 100% Complete</text>

  <!-- Comparison table -->
  <text x="640" y="440" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="bold">Two Domains, One Framework</text>

  <!-- Table header -->
  <rect x="60" y="460" width="1160" height="38" rx="6" fill="#0d419d"/>
  <text x="190" y="484" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">Aspect</text>
  <text x="510" y="484" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">DNOTAM</text>
  <text x="890" y="484" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="bold">ED-254 (AMAN)</text>

  <!-- Rows -->
  <rect x="60" y="500" width="1160" height="32" fill="#1c2333"/>
  <text x="100" y="521" fill="#8b949e" font-size="13">Data Model</text>
  <text x="510" y="521" text-anchor="middle" fill="#f85149" font-size="13">AIXM 5.1.1 (XML)</text>
  <text x="890" y="521" text-anchor="middle" fill="#58a6ff" font-size="13">FIXM 4.3 (XML)</text>

  <rect x="60" y="534" width="1160" height="32" fill="#161b22"/>
  <text x="100" y="555" fill="#8b949e" font-size="13">Event Frequency</text>
  <text x="510" y="555" text-anchor="middle" fill="#f85149" font-size="13">Low (dozens/day)</text>
  <text x="890" y="555" text-anchor="middle" fill="#58a6ff" font-size="13">High (hundreds/second)</text>

  <rect x="60" y="568" width="1160" height="32" fill="#1c2333"/>
  <text x="100" y="589" fill="#8b949e" font-size="13">Event Size</text>
  <text x="510" y="589" text-anchor="middle" fill="#f85149" font-size="13">Large (100KB-1MB)</text>
  <text x="890" y="589" text-anchor="middle" fill="#58a6ff" font-size="13">Small (5-50KB)</text>

  <rect x="60" y="602" width="1160" height="32" fill="#161b22"/>
  <text x="100" y="623" fill="#8b949e" font-size="13">Latency SLA</text>
  <text x="510" y="623" text-anchor="middle" fill="#f85149" font-size="13">&lt; 5 seconds</text>
  <text x="890" y="623" text-anchor="middle" fill="#58a6ff" font-size="13">&lt; 500ms</text>

  <rect x="60" y="636" width="1160" height="32" rx="0" fill="#1c2333"/>
  <text x="100" y="657" fill="#8b949e" font-size="13">Specification</text>
  <text x="510" y="657" text-anchor="middle" fill="#f85149" font-size="13">SWIM Registry Service Definition</text>
  <text x="890" y="657" text-anchor="middle" fill="#58a6ff" font-size="13">EUROCAE ED-254</text>

  <!-- Bottom emphasis -->
  <rect x="60" y="675" width="1160" height="32" rx="6" fill="#0d419d" fill-opacity="0.3"/>
  <text x="640" y="696" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Same 5 SPIs. Different domain. Same framework. That's the proof.</text>
</svg>

