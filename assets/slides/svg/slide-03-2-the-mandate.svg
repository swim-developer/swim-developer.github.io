<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <rect width="1280" height="720" fill="#0d1117"/>

  <!-- Big year -->
  <text x="340" y="320" text-anchor="middle" fill="#f85149" font-size="180" font-weight="900" letter-spacing="-5">2026</text>
  <text x="340" y="370" text-anchor="middle" fill="#8b949e" font-size="22">CP1 Compliance Deadline</text>
  <text x="340" y="400" text-anchor="middle" fill="#484f58" font-size="16">EU Regulation 2021/116</text>

  <!-- Services list -->
  <text x="720" y="140" fill="#58a6ff" font-size="20" font-weight="bold">Every ANSP must implement:</text>

  <!-- Service cards -->
  <rect x="700" y="170" width="480" height="55" rx="8" fill="#1c2333" stroke="#f85149" stroke-width="1.5"/>
  <circle cx="730" cy="197" r="8" fill="#f85149"/>
  <text x="755" y="193" fill="#f0f6fc" font-size="17" font-weight="600">DNOTAM</text>
  <text x="755" y="213" fill="#8b949e" font-size="13">Digital NOTAM — operational changes</text>

  <rect x="700" y="235" width="480" height="55" rx="8" fill="#1c2333" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="730" cy="262" r="8" fill="#3fb950"/>
  <text x="755" y="258" fill="#f0f6fc" font-size="17" font-weight="600">AIFS</text>
  <text x="755" y="278" fill="#8b949e" font-size="13">Aeronautical Information Flight Service</text>

  <rect x="700" y="300" width="480" height="55" rx="8" fill="#1c2333" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="730" cy="327" r="8" fill="#d29922"/>
  <text x="755" y="323" fill="#f0f6fc" font-size="17" font-weight="600">AMAP</text>
  <text x="755" y="343" fill="#8b949e" font-size="13">Aerodrome Mapping</text>

  <rect x="700" y="365" width="480" height="55" rx="8" fill="#1c2333" stroke="#a371f7" stroke-width="1.5"/>
  <circle cx="730" cy="392" r="8" fill="#a371f7"/>
  <text x="755" y="388" fill="#f0f6fc" font-size="17" font-weight="600">MET</text>
  <text x="755" y="408" fill="#8b949e" font-size="13">Meteorological Information (IWXXM)</text>

  <rect x="700" y="430" width="480" height="55" rx="8" fill="#1c2333" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="730" cy="457" r="8" fill="#58a6ff"/>
  <text x="755" y="453" fill="#f0f6fc" font-size="17" font-weight="600">Extended AMAN (ED-254)</text>
  <text x="755" y="473" fill="#8b949e" font-size="13">Arrival Sequence Service</text>

  <!-- Timeline -->
  <line x1="100" y1="580" x2="1180" y2="580" stroke="#30363d" stroke-width="2"/>

  <!-- Timeline dots and labels -->
  <circle cx="180" cy="580" r="8" fill="#484f58"/>
  <text x="180" y="560" text-anchor="middle" fill="#484f58" font-size="14" font-weight="bold">2012</text>
  <text x="180" y="610" text-anchor="middle" fill="#484f58" font-size="12">SWIM Concept</text>

  <circle cx="420" cy="580" r="8" fill="#8b949e"/>
  <text x="420" y="560" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="bold">2021</text>
  <text x="420" y="610" text-anchor="middle" fill="#8b949e" font-size="12">CP1 Regulation</text>

  <circle cx="660" cy="580" r="8" fill="#8b949e"/>
  <text x="660" y="560" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="bold">2024</text>
  <text x="660" y="610" text-anchor="middle" fill="#8b949e" font-size="12">Specs Published</text>

  <circle cx="900" cy="580" r="8" fill="#d29922"/>
  <text x="900" y="560" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">2025</text>
  <text x="900" y="610" text-anchor="middle" fill="#d29922" font-size="12">Training Brussels</text>

  <!-- Deadline pulse -->
  <circle cx="1100" cy="580" r="12" fill="#f85149"/>
  <circle cx="1100" cy="580" r="18" fill="none" stroke="#f85149" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="1100" cy="580" r="25" fill="none" stroke="#f85149" stroke-width="1" stroke-opacity="0.2"/>
  <text x="1100" y="560" text-anchor="middle" fill="#f85149" font-size="16" font-weight="900">2026</text>
  <text x="1100" y="615" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">DEADLINE</text>
</svg>

