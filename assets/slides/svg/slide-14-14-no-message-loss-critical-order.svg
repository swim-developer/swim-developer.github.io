<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Red Hat Text, sans-serif">
  <rect width="1000" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="bold">Subscription Lifecycle — No Message Loss</text>

  <!-- Actors -->
  <rect x="80" y="55" width="120" height="35" rx="6" fill="#1c2333" stroke="#58a6ff" stroke-width="1"/>
  <text x="140" y="78" text-anchor="middle" fill="#f0f6fc" font-size="13">Consumer</text>

  <rect x="380" y="55" width="180" height="35" rx="6" fill="#1c2333" stroke="#58a6ff" stroke-width="1"/>
  <text x="470" y="78" text-anchor="middle" fill="#f0f6fc" font-size="13">Framework (Internal)</text>

  <rect x="730" y="55" width="120" height="35" rx="6" fill="#1c2333" stroke="#58a6ff" stroke-width="1"/>
  <text x="790" y="78" text-anchor="middle" fill="#f0f6fc" font-size="13">Provider</text>

  <!-- Lifelines -->
  <line x1="140" y1="90" x2="140" y2="480" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="470" y1="90" x2="470" y2="480" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="790" y1="90" x2="790" y2="480" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1 -->
  <line x1="140" y1="120" x2="470" y2="120" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="305" y="112" text-anchor="middle" fill="#8b949e" font-size="12">POST /subscriptions</text>

  <!-- Step 2 -->
  <line x1="470" y1="160" x2="790" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="630" y="152" text-anchor="middle" fill="#8b949e" font-size="12">POST /swim/v1/subscriptions</text>

  <!-- Step 3 -->
  <line x1="790" y1="195" x2="470" y2="195" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="630" y="187" text-anchor="middle" fill="#8b949e" font-size="12">Response: PAUSED + queueName</text>

  <!-- Step 4: persist -->
  <rect x="400" y="215" width="140" height="30" rx="4" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="470" y="235" text-anchor="middle" fill="#8b949e" font-size="11">persist(MongoDB)</text>

  <!-- CRITICAL STEP - highlighted -->
  <rect x="280" y="260" width="380" height="55" rx="8" fill="#1a0000" stroke="#f85149" stroke-width="2"/>
  <text x="470" y="280" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">CRITICAL: AMQP consumer BEFORE activation</text>
  <text x="470" y="300" text-anchor="middle" fill="#f85149" font-size="12">registerAmqpConsumer(queueName)</text>

  <!-- Step 5: activate -->
  <line x1="470" y1="335" x2="790" y2="335" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="630" y="327" text-anchor="middle" fill="#3fb950" font-size="12">PUT /swim/v1 → status: ACTIVE</text>

  <!-- Step 6 -->
  <line x1="790" y1="370" x2="470" y2="370" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="630" y="362" text-anchor="middle" fill="#3fb950" font-size="12">Confirmed: ACTIVE</text>

  <!-- Step 7 -->
  <line x1="470" y1="405" x2="140" y2="405" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="305" y="397" text-anchor="middle" fill="#3fb950" font-size="12">201 Created</text>

  <!-- Warning box -->
  <rect x="580" y="420" width="380" height="60" rx="6" fill="#1a0000" stroke="#f85149" stroke-width="1"/>
  <text x="770" y="442" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">If reversed: Provider sends events</text>
  <text x="770" y="462" text-anchor="middle" fill="#f85149" font-size="12">but no queue connection → MESSAGE LOSS</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>

