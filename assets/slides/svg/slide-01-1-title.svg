<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Red Hat Display, sans-serif">
  <defs>
    <radialGradient id="radar" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#0d419d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0d1117"/>
  <rect width="1280" height="720" fill="url(#radar)"/>

  <!-- Subtle flight path lines -->
  <line x1="0" y1="400" x2="1280" y2="350" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.1"/>
  <line x1="0" y1="500" x2="1280" y2="420" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="200" y1="720" x2="800" y2="0" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Title -->
  <text x="640" y="230" text-anchor="middle" fill="#f0f6fc" font-size="56" font-weight="bold" letter-spacing="2">swim-developer</text>

  <!-- Divider -->
  <rect x="440" y="260" width="400" height="2" fill="url(#line-fade)" rx="1"/>

  <!-- Subtitle -->
  <text x="640" y="310" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="300">An Open Source Reference Implementation</text>
  <text x="640" y="345" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="300">for SWIM Services</text>

  <!-- Event badge -->
  <rect x="470" y="420" width="340" height="40" rx="20" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="640" y="446" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="500">SWIM Foundation Group — April 15, 2026</text>

  <!-- Author -->
  <text x="640" y="540" text-anchor="middle" fill="#f0f6fc" font-size="20">Marcelo Sales</text>
  <text x="640" y="570" text-anchor="middle" fill="#8b949e" font-size="15">Red Hat SWIM Team · SFG Member</text>

  <!-- Red Hat logo placeholder -->
  <rect x="580" y="620" width="120" height="4" rx="2" fill="#EE0000"/>
</svg>

