<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64ffda"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6ea8fe"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="34" font-weight="700">Subscription Lifecycle: Complexity Absorbed</text>
  <text x="600" y="82" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="20">Internal apps manage subscriptions via simple REST &#8212; the framework handles the rest</text>

  <!-- LEFT SIDE: Internal Business Apps -->
  <text x="175" y="130" text-anchor="middle" fill="#64ffda" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">INTERNAL (Simple)</text>

  <!-- App 1: Flight Ops -->
  <g transform="translate(40, 155)">
    <rect x="0" y="0" width="130" height="80" rx="10" fill="#0f1624" stroke="#6ea8fe" stroke-width="2"/>
    <text x="65" y="32" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">Flight Ops</text>
    <text x="65" y="52" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="11">POST /subscribe</text>
    <text x="65" y="68" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">runway closures</text>
  </g>

  <!-- App 2: Safety Alerting -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="130" height="80" rx="10" fill="#0f1624" stroke="#6ea8fe" stroke-width="2"/>
    <text x="65" y="32" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">Safety Alert</text>
    <text x="65" y="52" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="11">POST /subscribe</text>
    <text x="65" y="68" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">obstacles</text>
  </g>

  <!-- App 3: ATC Dashboard -->
  <g transform="translate(40, 365)">
    <rect x="0" y="0" width="130" height="80" rx="10" fill="#0f1624" stroke="#6ea8fe" stroke-width="2"/>
    <text x="65" y="32" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">ATC Dashboard</text>
    <text x="65" y="52" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="11">GET /subscriptions</text>
    <text x="65" y="68" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">all active subs</text>
  </g>

  <!-- App 4: Compliance -->
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="130" height="80" rx="10" fill="#0f1624" stroke="#6ea8fe" stroke-width="2"/>
    <text x="65" y="32" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">Compliance</text>
    <text x="65" y="52" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="11">PUT /pause</text>
    <text x="65" y="68" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">audit control</text>
  </g>

  <!-- Arrows from apps to Consumer APIs -->
  <path d="M175 195 L265 290" stroke="#6ea8fe" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M175 300 L265 310" stroke="#6ea8fe" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M175 405 L265 340" stroke="#6ea8fe" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M175 510 L265 360" stroke="#6ea8fe" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- CENTER: DNOTAM Consumer -->
  <g transform="translate(275, 150)">
    <rect x="0" y="0" width="340" height="430" rx="14" fill="#004085" stroke="#6ea8fe" stroke-width="2"/>
    <text x="170" y="32" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="20" font-weight="700">DNOTAM Consumer</text>
    <text x="170" y="55" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="13">swim-framework-consumer</text>

    <!-- Internal REST API section -->
    <rect x="15" y="72" width="310" height="155" rx="8" fill="#0056b3"/>
    <text x="170" y="95" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="16" font-weight="600">Subscription REST API</text>
    <text x="170" y="115" text-anchor="middle" fill="#64ffda" font-family="Red Hat Text, sans-serif" font-size="12">exposed to internal apps only</text>

    <rect x="30" y="128" width="130" height="28" rx="4" fill="#004085"/>
    <text x="95" y="147" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="12">POST /subscribe</text>

    <rect x="180" y="128" width="130" height="28" rx="4" fill="#004085"/>
    <text x="245" y="147" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="12">DELETE /unsub</text>

    <rect x="30" y="165" width="130" height="28" rx="4" fill="#004085"/>
    <text x="95" y="184" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="12">PUT /pause</text>

    <rect x="180" y="165" width="130" height="28" rx="4" fill="#004085"/>
    <text x="245" y="184" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Mono, monospace" font-size="12">PUT /resume</text>

    <text x="170" y="213" text-anchor="middle" fill="#8892b0" font-family="Red Hat Mono, monospace" font-size="11">GET /subscriptions &#183; GET /topics</text>

    <!-- Divider -->
    <line x1="20" y1="240" x2="320" y2="240" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="170" y="260" text-anchor="middle" fill="#64ffda" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">Framework Magic</text>

    <!-- What the framework does internally -->
    <rect x="15" y="272" width="310" height="145" rx="8" fill="#002752"/>

    <rect x="30" y="284" width="130" height="30" rx="4" fill="#0056b3"/>
    <text x="95" y="304" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="12">mTLS Negotiation</text>

    <rect x="180" y="284" width="130" height="30" rx="4" fill="#0056b3"/>
    <text x="245" y="304" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="12">EACP Certificates</text>

    <rect x="30" y="322" width="130" height="30" rx="4" fill="#0056b3"/>
    <text x="95" y="342" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="12">AMQP Queue Bind</text>

    <rect x="180" y="322" width="130" height="30" rx="4" fill="#0056b3"/>
    <text x="245" y="342" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="12">Heartbeat Check</text>

    <rect x="30" y="360" width="130" height="30" rx="4" fill="#0056b3"/>
    <text x="95" y="380" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="12">State Persistence</text>

    <rect x="180" y="360" width="130" height="30" rx="4" fill="#0056b3"/>
    <text x="245" y="380" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="12">Error Recovery</text>

    <text x="170" y="410" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Mono, monospace" font-size="12">Invisible to business apps</text>
  </g>

  <!-- RIGHT SIDE: External SWIM World -->
  <text x="890" y="130" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">EXTERNAL (Complex)</text>

  <!-- Arrow from Consumer to External Subscription Manager -->
  <path d="M620 300 L700 240" stroke="#64ffda" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="670" y="250" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10" transform="rotate(-20, 670, 250)">HTTPS + mTLS</text>

  <!-- External Subscription Manager -->
  <g transform="translate(710, 160)">
    <rect x="0" y="0" width="200" height="100" rx="12" fill="#28a745"/>
    <text x="100" y="28" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">Subscription Manager</text>
    <text x="100" y="48" text-anchor="middle" fill="#d4edda" font-family="Red Hat Text, sans-serif" font-size="12">AISP / EUROCONTROL</text>
    <text x="100" y="68" text-anchor="middle" fill="#d4edda" font-family="Red Hat Mono, monospace" font-size="11">SWIM Yellow Profile</text>
    <text x="100" y="88" text-anchor="middle" fill="#d4edda" font-family="Red Hat Mono, monospace" font-size="11">REST + EACP PKI</text>
  </g>

  <!-- Arrow from Consumer to Artemis -->
  <path d="M620 400 L700 430" stroke="#64ffda" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="670" y="430" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10" transform="rotate(12, 670, 430)">AMQPS + mTLS</text>

  <!-- External Artemis Broker -->
  <g transform="translate(710, 380)">
    <rect x="0" y="0" width="200" height="100" rx="12" fill="#28a745"/>
    <text x="100" y="28" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">AMQP Broker</text>
    <text x="100" y="48" text-anchor="middle" fill="#d4edda" font-family="Red Hat Text, sans-serif" font-size="12">AISP / EUROCONTROL</text>
    <text x="100" y="68" text-anchor="middle" fill="#d4edda" font-family="Red Hat Mono, monospace" font-size="11">AMQP 1.0 over TLS 1.2</text>
    <text x="100" y="88" text-anchor="middle" fill="#d4edda" font-family="Red Hat Mono, monospace" font-size="11">DNOTAM Event Stream</text>
  </g>

  <!-- Complexity lines from external -->
  <g opacity="0.35">
    <path d="M920 210 L1000 175" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M920 230 L1000 220" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M920 430 L1000 400" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M920 450 L1000 470" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Complexity items -->
  <g transform="translate(970, 155)">
    <rect x="0" y="0" width="195" height="30" rx="4" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="97" y="20" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Mono, monospace" font-size="11">X.509 certificate chains</text>
  </g>
  <g transform="translate(970, 195)">
    <rect x="0" y="0" width="195" height="30" rx="4" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="97" y="20" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Mono, monospace" font-size="11">SASL authentication</text>
  </g>
  <g transform="translate(970, 380)">
    <rect x="0" y="0" width="195" height="30" rx="4" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="97" y="20" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Mono, monospace" font-size="11">Queue binding lifecycle</text>
  </g>
  <g transform="translate(970, 420)">
    <rect x="0" y="0" width="195" height="30" rx="4" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="97" y="20" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Mono, monospace" font-size="11">Yellow Profile compliance</text>
  </g>
  <g transform="translate(970, 460)">
    <rect x="0" y="0" width="195" height="30" rx="4" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="97" y="20" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Mono, monospace" font-size="11">Connection recovery</text>
  </g>

  <!-- ABSTRACTION BOUNDARY -->
  <line x1="625" y1="145" x2="625" y2="590" stroke="#64ffda" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="640" y="555" fill="#64ffda" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600" transform="rotate(-90, 640, 555)">ABSTRACTION BOUNDARY</text>

  <!-- BOTTOM: Key message boxes -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="540" height="130" rx="14" fill="#0f1624" stroke="#6ea8fe" stroke-width="2"/>
    <text x="270" y="30" text-anchor="middle" fill="#6ea8fe" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">What Internal Apps See</text>
    <text x="30" y="58" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">&#10003; Simple REST API &#8212; standard HTTP verbs</text>
    <text x="30" y="82" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">&#10003; No AMQP, no mTLS, no certificates, no SWIM</text>
    <text x="30" y="106" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">&#10003; Subscribe, pause, resume, unsubscribe &#8212; done</text>
  </g>

  <g transform="translate(620, 600)">
    <rect x="0" y="0" width="540" height="130" rx="14" fill="#0f1624" stroke="#ff6b6b" stroke-width="2"/>
    <text x="270" y="30" text-anchor="middle" fill="#ff6b6b" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">What the Framework Handles</text>
    <text x="30" y="58" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">&#10003; mTLS negotiation with EACP certificates</text>
    <text x="30" y="82" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">&#10003; AMQP 1.0 queue binding on external broker</text>
    <text x="30" y="106" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">&#10003; Heartbeat monitoring, state sync, error recovery</text>
  </g>
</svg>
