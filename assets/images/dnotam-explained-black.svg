<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;700&amp;family=Red+Hat+Text:wght@400;500;600&amp;family=Red+Hat+Mono:wght@400;500&amp;display=swap');
        </style>
        <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
        </filter>
    </defs>

    <!-- Title -->
    <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="28" font-family="'Red Hat Display', Arial, sans-serif">Digital NOTAM — From Text to Data</text>

    <!-- Definition Box -->
    <rect x="100" y="65" width="1000" height="60" rx="10" fill="#1565c0" filter="url(#shadow)"/>
    <text x="600" y="92" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="16" font-family="'Red Hat Text', Arial, sans-serif">A temporary operational change (event) affecting flight operations,</text>
    <text x="600" y="112" text-anchor="middle" fill="#bbdefb" font-weight="400" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">encoded in machine-readable format (AIXM 5.1.1)</text>

    <!-- Before/After Comparison -->
    <g>
        <!-- BEFORE Column -->
        <rect x="100" y="150" width="480" height="280" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
        <rect x="100" y="150" width="480" height="45" rx="12" fill="#c62828"/>
        <rect x="100" y="185" width="480" height="10" fill="#c62828"/>
        <text x="340" y="182" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="18" font-family="'Red Hat Display', Arial, sans-serif">❌  Traditional NOTAM</text>

        <!-- Before items -->
        <rect x="130" y="215" width="420" height="45" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1"/>
        <text x="150" y="243" fill="#b71c1c" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Free text, hard to parse</text>

        <rect x="130" y="270" width="420" height="45" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1"/>
        <text x="150" y="298" fill="#b71c1c" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Manual reading required</text>

        <rect x="130" y="325" width="420" height="45" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1"/>
        <text x="150" y="353" fill="#b71c1c" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">No graphical display</text>

        <rect x="130" y="380" width="420" height="45" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1"/>
        <text x="150" y="408" fill="#b71c1c" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Generic information for all flights</text>
    </g>

    <g>
        <!-- AFTER Column -->
        <rect x="620" y="150" width="480" height="280" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
        <rect x="620" y="150" width="480" height="45" rx="12" fill="#2e7d32"/>
        <rect x="620" y="185" width="480" height="10" fill="#2e7d32"/>
        <text x="860" y="182" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="18" font-family="'Red Hat Display', Arial, sans-serif">✓  Digital NOTAM</text>

        <!-- After items -->
        <rect x="650" y="215" width="420" height="45" rx="6" fill="#ffffff" stroke="#a5d6a7" stroke-width="1"/>
        <text x="670" y="243" fill="#1b5e20" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Structured data (AIXM 5.1.1)</text>

        <rect x="650" y="270" width="420" height="45" rx="6" fill="#ffffff" stroke="#a5d6a7" stroke-width="1"/>
        <text x="670" y="298" fill="#1b5e20" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Automatic processing</text>

        <rect x="650" y="325" width="420" height="45" rx="6" fill="#ffffff" stroke="#a5d6a7" stroke-width="1"/>
        <text x="670" y="353" fill="#1b5e20" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Visual on maps / cockpit</text>

        <rect x="650" y="380" width="420" height="45" rx="6" fill="#ffffff" stroke="#a5d6a7" stroke-width="1"/>
        <text x="670" y="408" fill="#1b5e20" font-weight="600" font-size="14" font-family="'Red Hat Text', Arial, sans-serif">Filtered by specific route</text>
    </g>

    <!-- Arrow between columns -->
    <polygon points="590,290 610,280 610,300" fill="#b0bec5"/>
    <line x1="580" y1="290" x2="590" y2="290" stroke="#b0bec5" stroke-width="3"/>

    <!-- Event Examples -->
    <rect x="100" y="455" width="700" height="100" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
    <rect x="100" y="455" width="700" height="35" rx="12" fill="#ef6c00"/>
    <rect x="100" y="480" width="700" height="10" fill="#ef6c00"/>
    <text x="450" y="480" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="14" font-family="'Red Hat Display', Arial, sans-serif">Event Scenarios (Examples)</text>

    <rect x="130" y="505" width="145" height="35" rx="6" fill="#ffffff" stroke="#ffcc80" stroke-width="1"/>
    <text x="202" y="528" text-anchor="middle" fill="#e65100" font-weight="500" font-size="12" font-family="'Red Hat Text', Arial, sans-serif">Runway Closure</text>

    <rect x="290" y="505" width="145" height="35" rx="6" fill="#ffffff" stroke="#ffcc80" stroke-width="1"/>
    <text x="362" y="528" text-anchor="middle" fill="#e65100" font-weight="500" font-size="12" font-family="'Red Hat Text', Arial, sans-serif">New Obstacle</text>

    <rect x="450" y="505" width="165" height="35" rx="6" fill="#ffffff" stroke="#ffcc80" stroke-width="1"/>
    <text x="532" y="528" text-anchor="middle" fill="#e65100" font-weight="500" font-size="12" font-family="'Red Hat Text', Arial, sans-serif">Navaid Unserviceable</text>

    <rect x="630" y="505" width="155" height="35" rx="6" fill="#ffffff" stroke="#ffcc80" stroke-width="1"/>
    <text x="707" y="528" text-anchor="middle" fill="#e65100" font-weight="500" font-size="12" font-family="'Red Hat Text', Arial, sans-serif">Airspace Activation</text>

    <!-- Key Message -->
    <rect x="830" y="455" width="270" height="100" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
    <text x="965" y="495" text-anchor="middle" fill="#1565c0" font-weight="700" font-size="15" font-family="'Red Hat Display', Arial, sans-serif">Mandatory in EU</text>
    <text x="965" y="520" text-anchor="middle" fill="#1565c0" font-weight="700" font-size="22" font-family="'Red Hat Display', Arial, sans-serif">Dec 31, 2025</text>
    <text x="965" y="545" text-anchor="middle" fill="#1976d2" font-size="11" font-family="'Red Hat Text', Arial, sans-serif">CP1 Regulation (EU 2021/116)</text>
</svg>
