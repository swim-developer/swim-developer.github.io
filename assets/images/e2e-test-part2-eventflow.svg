<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1130 850" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style type="text/css">
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        </style>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
        </marker>
        <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
    </defs>

    <!-- ==================== TITLE ==================== -->
    <text x="565" y="35" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="24" font-family="'Inter', sans-serif">E2E Test — Part 2: Connect &amp; Event Flow</text>
    <text x="565" y="58" text-anchor="middle" fill="#888888" font-size="16" font-family="'Inter', sans-serif">mTLS + OAuth2/OIDC | Yellow Profile Compliant</text>

    <!-- ==================== PARTICIPANTS ==================== -->
    
    <!-- User (UML Actor) -->
    <circle cx="60" cy="95" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="107" x2="60" y2="125" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="115" x2="80" y2="115" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="125" x2="45" y2="145" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="125" x2="75" y2="145" stroke="#ffffff" stroke-width="2"/>
    <text x="60" y="165" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">User</text>
    <line x1="60" y1="175" x2="60" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- MockClient -->
    <rect x="120" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="170" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">MockClient</text>
    <line x1="170" y1="145" x2="170" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Keycloak -->
    <rect x="270" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="320" y="115" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Keycloak</text>
    <text x="320" y="132" text-anchor="middle" fill="#888888" font-size="14" font-family="'Inter', sans-serif">«external»</text>
    <line x1="320" y1="145" x2="320" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Provider -->
    <rect x="420" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="470" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Provider</text>
    <line x1="470" y1="145" x2="470" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- AMQ Broker -->
    <rect x="570" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="620" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">AMQ Broker</text>
    <line x1="620" y1="145" x2="620" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Kafka -->
    <rect x="720" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="770" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Kafka</text>
    <line x1="770" y1="145" x2="770" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Consumer -->
    <rect x="870" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="920" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Consumer</text>
    <line x1="920" y1="145" x2="920" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- MockServer -->
    <rect x="1020" y="90" width="100" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="1070" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">MockServer</text>
    <line x1="1070" y1="145" x2="1070" y2="770" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- ==================== PHASE 3: ACTIVATE & CONNECT ==================== -->
    <text x="30" y="210" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">ACTIVATE &amp; CONNECT</text>
    <line x1="30" y1="218" x2="200" y2="218" stroke="#444444" stroke-width="1"/>

    <!-- 11. Activate -->
    <line x1="65" y1="245" x2="165" y2="245" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="115" y="238" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">11: activate(subscriptionId)</text>

    <!-- 12. PUT status -->
    <line x1="175" y1="280" x2="465" y2="280" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="320" y="273" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">12: PUT {status: ACTIVE}</text>

    <!-- 13. Connect AMQP -->
    <line x1="65" y1="320" x2="165" y2="320" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="115" y="313" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">13: connect(broker)</text>

    <!-- 14. AMQP Connect -->
    <line x1="175" y1="355" x2="615" y2="355" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="395" y="348" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">14: AMQP 1.0 connect [mTLS + user/pass]</text>

    <!-- 15. Validate with Keycloak -->
    <line x1="615" y1="390" x2="325" y2="390" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="470" y="383" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">15: validateCredentials(user, pass)</text>

    <!-- 16. Token validated -->
    <line x1="325" y1="425" x2="615" y2="425" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="470" y="418" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">16: tokenValidated</text>

    <!-- 17. Connection established -->
    <line x1="615" y1="460" x2="175" y2="460" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="395" y="453" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">17: connected</text>

    <!-- ==================== PHASE 4: EVENT FLOW & DELIVERY ==================== -->
    <text x="30" y="510" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">EVENT FLOW &amp; DELIVERY</text>
    <line x1="30" y1="518" x2="220" y2="518" stroke="#444444" stroke-width="1"/>

    <!-- 18. Open Messages tab -->
    <line x1="65" y1="545" x2="165" y2="545" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="115" y="538" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">18: openMessagesTab()</text>

    <!-- 19. Send event via MockServer -->
    <line x1="65" y1="580" x2="1065" y2="580" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="565" y="573" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">19: sendEvent(DNOTAM: RWY.CLS + EGLL)</text>

    <!-- 20. Consumer receives -->
    <line x1="1065" y1="615" x2="925" y2="615" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="995" y="608" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">20: AMQP message</text>

    <!-- 21. Consumer to Kafka -->
    <line x1="915" y1="650" x2="775" y2="650" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="845" y="643" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">21: publish(event)</text>

    <!-- 22. Provider consumes from Kafka -->
    <line x1="765" y1="685" x2="475" y2="685" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="620" y="678" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">22: consume()</text>

    <!-- 23. Provider publishes to Broker -->
    <line x1="475" y1="720" x2="615" y2="720" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="545" y="713" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">23: publishToQueue()</text>

    <!-- 24. Broker delivers -->
    <line x1="615" y1="755" x2="175" y2="755" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="395" y="748" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">24: deliver(message) [filter matched]</text>

    <!-- 25. Display to user -->
    <line x1="165" y1="790" x2="65" y2="790" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="115" y="783" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">25: displayEvent()</text>

    <!-- ==================== LEGEND ==================== -->
    <rect x="30" y="810" width="1090" height="35" rx="4" fill="#1a1a1a" stroke="#444444" stroke-width="1"/>
    
    <text x="50" y="833" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">Event Flow:</text>
    <text x="150" y="833" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">MockServer → Consumer → Kafka → Provider → AMQ Broker → MockClient</text>

    <text x="680" y="833" fill="#888888" font-size="14" font-family="'Inter', sans-serif">AMQ Broker validates credentials via Keycloak</text>
    
    <!-- Badge -->
    <rect x="1000" y="812" width="100" height="28" rx="14" fill="#ffc107"/>
    <text x="1050" y="832" text-anchor="middle" fill="#000000" font-weight="600" font-size="14" font-family="'Inter', sans-serif">Part 2/2</text>

</svg>

