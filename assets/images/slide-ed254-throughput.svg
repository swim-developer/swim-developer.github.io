<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowConv" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#64ffda" opacity="0.7"/>
    </marker>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#64ffda;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#64ffda;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="mapFade" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#8892b0;stop-opacity:0.12"/>
      <stop offset="70%" style="stop-color:#8892b0;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#8892b0;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="32" font-weight="700">ED-254 Consumer: Arrival Sequence Throughput</text>
  <text x="600" y="75" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="18">Single pod benchmark in development environment</text>

  <!-- ============================================================ -->
  <!-- EUROPE MAP AREA (left 60%) -->
  <!-- ============================================================ -->

  <!-- Simplified Europe outline (faint silhouette) -->
  <path d="
    M 46,555
    C 55,575 90,585 140,570
    C 170,560 210,540 250,525
    C 280,515 320,515 360,525
    C 380,530 395,555 410,545
    C 425,535 445,515 470,520
    C 510,530 555,565 590,570
    C 610,555 630,530 650,505
    C 665,475 680,440 685,400
    C 690,360 680,320 665,280
    C 650,250 640,225 625,210
    C 600,185 560,180 520,195
    C 480,175 440,165 400,185
    C 370,200 355,230 365,265
    C 375,290 395,305 385,320
    C 370,330 340,325 310,330
    C 290,340 275,350 250,365
    C 220,380 190,385 175,410
    C 165,435 155,470 140,500
    C 120,530 85,545 46,555
    Z"
    fill="url(#mapFade)" stroke="#8892b0" stroke-width="0.5" opacity="0.5"/>

  <!-- Map glow at center (Frankfurt area) -->
  <circle cx="353" cy="390" r="120" fill="url(#centerGlow)"/>

  <!-- Convergence lines from cities to central ANSP -->
  <!-- Each line: from city dot to Frankfurt center -->
  <g opacity="0.5">
    <line x1="46" y1="555" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="140" y1="538" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="94" y1="347" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="201" y1="375" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="242" y1="412" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="278" y1="385" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="287" y1="361" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="420" y1="312" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="387" y1="250" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="515" y1="259" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="632" y1="244" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="349" y1="436" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="485" y1="425" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="449" y1="396" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="418" y1="517" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="611" y1="567" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="565" y1="364" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
    <line x1="653" y1="480" x2="353" y2="390" stroke="#64ffda" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowConv)"/>
  </g>

  <!-- City dots with ICAO codes -->
  <g font-family="Red Hat Mono, monospace" font-size="9" fill="#8892b0">
    <!-- Lisbon -->
    <circle cx="46" cy="555" r="4" fill="#6ea8fe"/>
    <text x="46" y="545" text-anchor="middle">LPPT</text>

    <!-- Madrid -->
    <circle cx="140" cy="538" r="4" fill="#6ea8fe"/>
    <text x="140" y="528" text-anchor="middle">LEMD</text>

    <!-- Dublin -->
    <circle cx="94" cy="347" r="4" fill="#6ea8fe"/>
    <text x="94" y="337" text-anchor="middle">EIDW</text>

    <!-- London -->
    <circle cx="201" cy="375" r="4" fill="#6ea8fe"/>
    <text x="201" y="365" text-anchor="middle">EGLL</text>

    <!-- Paris -->
    <circle cx="242" cy="412" r="4" fill="#6ea8fe"/>
    <text x="242" y="427" text-anchor="middle">LFPG</text>

    <!-- Brussels -->
    <circle cx="278" cy="385" r="4" fill="#6ea8fe"/>
    <text x="278" y="375" text-anchor="middle">EBBR</text>

    <!-- Amsterdam -->
    <circle cx="287" cy="361" r="4" fill="#6ea8fe"/>
    <text x="303" y="354" text-anchor="start">EHAM</text>

    <!-- Copenhagen -->
    <circle cx="420" cy="312" r="4" fill="#6ea8fe"/>
    <text x="420" y="302" text-anchor="middle">EKCH</text>

    <!-- Oslo -->
    <circle cx="387" cy="250" r="4" fill="#6ea8fe"/>
    <text x="387" y="240" text-anchor="middle">ENGM</text>

    <!-- Stockholm -->
    <circle cx="515" cy="259" r="4" fill="#6ea8fe"/>
    <text x="515" y="249" text-anchor="middle">ESSA</text>

    <!-- Helsinki -->
    <circle cx="632" cy="244" r="4" fill="#6ea8fe"/>
    <text x="632" y="234" text-anchor="middle">EFHK</text>

    <!-- Zurich -->
    <circle cx="349" cy="436" r="4" fill="#6ea8fe"/>
    <text x="349" y="451" text-anchor="middle">LSZH</text>

    <!-- Vienna -->
    <circle cx="485" cy="425" r="4" fill="#6ea8fe"/>
    <text x="485" y="440" text-anchor="middle">LOWW</text>

    <!-- Prague -->
    <circle cx="449" cy="396" r="4" fill="#6ea8fe"/>
    <text x="449" y="386" text-anchor="middle">LKPR</text>

    <!-- Rome -->
    <circle cx="418" cy="517" r="4" fill="#6ea8fe"/>
    <text x="418" y="532" text-anchor="middle">LIRF</text>

    <!-- Athens -->
    <circle cx="611" cy="567" r="4" fill="#6ea8fe"/>
    <text x="611" y="582" text-anchor="middle">LGAV</text>

    <!-- Warsaw -->
    <circle cx="565" cy="364" r="4" fill="#6ea8fe"/>
    <text x="565" y="354" text-anchor="middle">EPWA</text>

    <!-- Bucharest -->
    <circle cx="653" cy="480" r="4" fill="#6ea8fe"/>
    <text x="653" y="495" text-anchor="middle">LROP</text>
  </g>

  <!-- ============================================================ -->
  <!-- CENTRAL ANSP (the convergence point) -->
  <!-- ============================================================ -->

  <!-- Outer pulse ring -->
  <circle cx="353" cy="390" r="22" fill="none" stroke="#64ffda" stroke-width="1.5" opacity="0.4"/>
  <circle cx="353" cy="390" r="32" fill="none" stroke="#64ffda" stroke-width="0.8" opacity="0.2"/>

  <!-- Inner solid point -->
  <circle cx="353" cy="390" r="10" fill="#64ffda" opacity="0.7"/>
  <circle cx="353" cy="390" r="5" fill="#fff"/>

  <!-- ANSP label -->
  <text x="353" y="370" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="11" font-weight="600">ANSP</text>
  <text x="353" y="420" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">ED-254 Consumer</text>
  <text x="353" y="433" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">Single Pod</text>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Performance Metric -->
  <!-- ============================================================ -->

  <g transform="translate(750, 110)">
    <!-- Panel background -->
    <rect x="0" y="0" width="420" height="500" rx="16" fill="#0f1624" stroke="#64ffda" stroke-width="1.5" opacity="0.9"/>

    <!-- Throughput metric -->
    <text x="210" y="45" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="16">average throughput</text>
    <text x="195" y="130" text-anchor="middle" fill="#64ffda" font-family="Red Hat Display, sans-serif" font-size="110" font-weight="700">~500</text>
    <text x="210" y="168" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="26" font-weight="600">messages / second</text>

    <!-- Divider -->
    <line x1="40" y1="190" x2="380" y2="190" stroke="#64ffda" stroke-width="1" opacity="0.3"/>

    <!-- Latency metric -->
    <text x="210" y="225" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="16">average end-to-end pipeline latency</text>
    <text x="170" y="300" text-anchor="middle" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="90" font-weight="700">~9</text>
    <text x="260" y="300" text-anchor="start" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="36" font-weight="600">ms</text>
    <text x="210" y="330" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="15">receive &#8594; validate &#8594; XSD &#8594; rules &#8594; Kafka</text>

    <!-- Divider -->
    <line x1="40" y1="355" x2="380" y2="355" stroke="#64ffda" stroke-width="1" opacity="0.3"/>

    <!-- Context -->
    <text x="210" y="390" text-anchor="middle" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">Single Pod &#183; Dev Environment</text>

    <!-- Details -->
    <text x="30" y="425" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="14">Arrival sequence events from</text>
    <text x="30" y="445" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="14">18+ European airports processed</text>
    <text x="30" y="465" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="14">end-to-end by a single Quarkus pod.</text>
    <text x="30" y="485" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="14">Ready for business consumption on Kafka.</text>
  </g>
</svg>
