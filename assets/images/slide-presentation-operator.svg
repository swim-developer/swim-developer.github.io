<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradOp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <marker id="arrowOp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64ffda"/>
    </marker>
  </defs>
  
  <!-- Background transparent for PNG export -->
  
  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="42" font-weight="700">SWIM Operator</text>
  <text x="600" y="95" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="24">One YAML. Complete Infrastructure.</text>
  
  <!-- Left side: 4 Custom Resources -->
  <g transform="translate(30, 140)">
    <text x="155" y="0" text-anchor="middle" fill="#64ffda" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">Custom Resources</text>
    
    <!-- MockServer -->
    <rect x="0" y="20" width="310" height="60" rx="8" fill="#0f1624" stroke="#64ffda" stroke-width="2"/>
    <text x="155" y="48" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="16" font-weight="600">SwimDnotamMockServer</text>
    <text x="155" y="70" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="16">Simulates External AISP</text>
    
    <!-- Consumer -->
    <rect x="0" y="90" width="310" height="60" rx="8" fill="#0f1624" stroke="#64ffda" stroke-width="2"/>
    <text x="155" y="118" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="16" font-weight="600">SwimDigitalNotamConsumer</text>
    <text x="155" y="140" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="16">Gateway In</text>
    
    <!-- Provider -->
    <rect x="0" y="160" width="310" height="60" rx="8" fill="#0f1624" stroke="#64ffda" stroke-width="2"/>
    <text x="155" y="188" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="16" font-weight="600">SwimDigitalNotamProvider</text>
    <text x="155" y="210" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="16">Gateway Out</text>
    
    <!-- MockClient -->
    <rect x="0" y="230" width="310" height="60" rx="8" fill="#0f1624" stroke="#64ffda" stroke-width="2"/>
    <text x="155" y="258" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="16" font-weight="600">SwimDnotamMockClient</text>
    <text x="155" y="280" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="16">Validates Provider</text>
  </g>
  
  <!-- Arrows from CRs to Operator -->
  <path d="M340 200 L440 290" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  <path d="M340 260 L440 305" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  <path d="M340 330 L440 325" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  <path d="M340 395 L440 345" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  
  <!-- Center: Operator -->
  <g transform="translate(450, 255)">
    <rect x="0" y="0" width="160" height="120" rx="16" fill="#cc0000"/>
    <text x="80" y="45" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="20" font-weight="700">SWIM</text>
    <text x="80" y="75" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="20" font-weight="700">Operator</text>
    <text x="80" y="105" text-anchor="middle" fill="#fadbd8" font-family="Red Hat Mono, monospace" font-size="16">OpenShift</text>
  </g>
  
  <!-- Arrows from Operator to Resources -->
  <path d="M610 295 L680 200" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  <path d="M610 310 L680 280" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  <path d="M610 330 L680 355" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  <path d="M610 350 L680 430" stroke="#64ffda" stroke-width="2" marker-end="url(#arrowOp)"/>
  
  <!-- Right side: Generated Resources -->
  <g transform="translate(690, 130)">
    <text x="230" y="0" text-anchor="middle" fill="#28a745" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">Generated Infrastructure</text>
    
    <!-- Row 1 -->
    <rect x="0" y="20" width="220" height="65" rx="10" fill="#e74c3c"/>
    <text x="110" y="50" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="16" font-weight="600">AMQ Broker</text>
    <text x="110" y="72" text-anchor="middle" fill="#fadbd8" font-family="Red Hat Mono, monospace" font-size="16">Artemis</text>
    
    <rect x="240" y="20" width="220" height="65" rx="10" fill="#d4a106"/>
    <text x="350" y="50" text-anchor="middle" fill="#000" font-family="Red Hat Text, sans-serif" font-size="16" font-weight="600">Event Bus</text>
    <text x="350" y="72" text-anchor="middle" fill="#000" font-family="Red Hat Mono, monospace" font-size="16">Apache Kafka</text>
    
    <!-- Row 2 -->
    <rect x="0" y="100" width="220" height="65" rx="10" fill="#336791"/>
    <text x="110" y="130" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="16" font-weight="600">Database</text>
    <text x="110" y="152" text-anchor="middle" fill="#cce5ff" font-family="Red Hat Mono, monospace" font-size="16">PostgreSQL</text>
    
    <rect x="240" y="100" width="220" height="65" rx="10" fill="#4db33d"/>
    <text x="350" y="130" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="16" font-weight="600">Document Store</text>
    <text x="350" y="152" text-anchor="middle" fill="#d4edda" font-family="Red Hat Mono, monospace" font-size="16">MongoDB</text>
    
    <!-- Row 3 -->
    <rect x="0" y="180" width="460" height="65" rx="10" fill="#0277bd"/>
    <text x="230" y="210" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="16" font-weight="600">mTLS Certificates</text>
    <text x="230" y="232" text-anchor="middle" fill="#b3e5fc" font-family="Red Hat Mono, monospace" font-size="16">Auto-generated via cert-manager</text>
    
    <!-- Row 4: The application itself -->
    <rect x="0" y="260" width="460" height="80" rx="10" fill="#7b1fa2"/>
    <text x="230" y="295" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600">SWIM Application</text>
    <text x="230" y="322" text-anchor="middle" fill="#e1bee7" font-family="Red Hat Mono, monospace" font-size="16">Quarkus + Routes + Services + ConfigMaps</text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="580" text-anchor="middle" fill="#64ffda" font-family="Red Hat Display, sans-serif" font-size="24" font-weight="600">Business YAML, not Infrastructure YAML</text>
  <text x="600" y="620" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="18">Focus on what matters. Let the Operator handle the complexity.</text>
</svg>
