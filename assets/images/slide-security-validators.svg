<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64ffda"/>
    </marker>
    <marker id="arrY" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a106"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="34" font-weight="700">Security &amp; Validation</text>
  <text x="600" y="75" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="18">Built in &#8212; test the full pipeline locally before production</text>

  <!-- ====== SECURITY BAR ====== -->
  <rect x="80" y="98" width="1040" height="60" rx="10" fill="#0f1624" stroke="#d4a106" stroke-width="1.5"/>

  <!-- Vertical separators -->
  <line x1="340" y1="103" x2="340" y2="153" stroke="#333" stroke-width="1"/>
  <line x1="600" y1="103" x2="600" y2="153" stroke="#333" stroke-width="1"/>
  <line x1="860" y1="103" x2="860" y2="153" stroke="#333" stroke-width="1"/>

  <!-- Item 1 -->
  <text x="210" y="122" text-anchor="middle" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">mTLS Everywhere</text>
  <text x="210" y="142" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">Mutual authentication enforced</text>

  <!-- Item 2 -->
  <text x="470" y="122" text-anchor="middle" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">EACP Trust Chain</text>
  <text x="470" y="142" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">Full certificate path validation</text>

  <!-- Item 3 -->
  <text x="730" y="122" text-anchor="middle" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">cert-manager</text>
  <text x="730" y="142" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">Automatic certificate rotation</text>

  <!-- Item 4 -->
  <text x="990" y="122" text-anchor="middle" fill="#d4a106" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="600">JWT / Keycloak</text>
  <text x="990" y="142" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">OAuth2 / OIDC + RBAC</text>

  <!-- ====== CONSUMER PIPELINE ====== -->

  <text x="110" y="195" fill="#4fc3f7" font-family="Red Hat Display, sans-serif" font-size="16" font-weight="600">Consumer Pipeline</text>

  <!-- Simulated Provider -->
  <g transform="translate(60, 215)">
    <rect x="0" y="0" width="210" height="140" rx="10" fill="#1a1a2e" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#333"/>
    <rect x="0" y="20" width="210" height="6" fill="#333"/>
    <text x="105" y="20" text-anchor="middle" fill="#bbb" font-family="Red Hat Display, sans-serif" font-size="12" font-weight="600">Simulated Provider</text>

    <text x="105" y="52" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">AMQP Broker</text>
    <text x="105" y="72" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">Subscription Manager</text>
    <text x="105" y="92" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">Event Generator</text>

    <text x="105" y="125" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">Deploys alongside</text>
  </g>

  <!-- Arrow with mTLS badge -->
  <path d="M275 285 L345 285" stroke="#64ffda" stroke-width="3" marker-end="url(#arrG)"/>
  <rect x="285" y="263" width="50" height="16" rx="8" fill="#d4a106"/>
  <text x="310" y="274" text-anchor="middle" fill="#000" font-family="Red Hat Mono, monospace" font-size="9" font-weight="600">mTLS</text>

  <!-- DNOTAM Consumer -->
  <g transform="translate(355, 215)">
    <rect x="0" y="0" width="300" height="140" rx="10" fill="#002752" stroke="#0d6efd" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="26" rx="10" fill="#004085"/>
    <rect x="0" y="20" width="300" height="6" fill="#004085"/>
    <text x="150" y="20" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="600">DNOTAM Consumer</text>

    <rect x="10" y="36" width="135" height="26" rx="5" fill="#004085"/>
    <text x="77" y="54" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">XSD Validation</text>

    <rect x="155" y="36" width="135" height="26" rx="5" fill="#004085"/>
    <text x="222" y="54" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">Custom Validators</text>

    <rect x="10" y="70" width="135" height="26" rx="5" fill="#004085"/>
    <text x="77" y="88" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">Custom Rules</text>

    <rect x="155" y="70" width="135" height="26" rx="5" fill="#004085"/>
    <text x="222" y="88" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">Inbox + Dedup</text>

    <text x="150" y="116" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">SPI: plug your own validators and rules</text>
    <text x="150" y="132" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="10">Multi-provider ready</text>
  </g>

  <!-- Arrow to Kafka -->
  <path d="M660 285 L730 285" stroke="#d4a106" stroke-width="3" marker-end="url(#arrY)"/>

  <!-- Kafka -->
  <g transform="translate(740, 215)">
    <rect x="0" y="0" width="210" height="140" rx="10" fill="#3e2c00" stroke="#d4a106" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#d4a106"/>
    <rect x="0" y="20" width="210" height="6" fill="#d4a106"/>
    <text x="105" y="20" text-anchor="middle" fill="#000" font-family="Red Hat Display, sans-serif" font-size="12" font-weight="700">Kafka</text>

    <text x="105" y="52" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="11">runway-closure</text>
    <text x="105" y="72" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="11">navaid-unserviceable</text>
    <text x="105" y="92" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="11">airspace-activation</text>

    <text x="105" y="125" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="10">Business intent routing</text>
  </g>

  <!-- ====== PROVIDER PIPELINE ====== -->

  <text x="110" y="400" fill="#81c784" font-family="Red Hat Display, sans-serif" font-size="16" font-weight="600">Provider Pipeline</text>

  <!-- Kafka (internal ingestion) -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="210" height="140" rx="10" fill="#3e2c00" stroke="#d4a106" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#d4a106"/>
    <rect x="0" y="20" width="210" height="6" fill="#d4a106"/>
    <text x="105" y="20" text-anchor="middle" fill="#000" font-family="Red Hat Display, sans-serif" font-size="12" font-weight="700">Kafka</text>

    <text x="105" y="52" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="11">dnotam-events</text>
    <text x="105" y="72" text-anchor="middle" fill="#d4a106" font-family="Red Hat Mono, monospace" font-size="11">dnotam-events-dlq</text>

    <text x="105" y="110" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="10">Internal ingestion port</text>
    <text x="105" y="128" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="10">Legacy system integration</text>
  </g>

  <!-- Arrow from Kafka -->
  <path d="M275 490 L345 490" stroke="#d4a106" stroke-width="3" marker-end="url(#arrY)"/>

  <!-- DNOTAM Provider -->
  <g transform="translate(355, 420)">
    <rect x="0" y="0" width="300" height="140" rx="10" fill="#0a1a0a" stroke="#43a047" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="26" rx="10" fill="#2e7d32"/>
    <rect x="0" y="20" width="300" height="6" fill="#2e7d32"/>
    <text x="150" y="20" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="600">DNOTAM Provider</text>

    <rect x="10" y="36" width="135" height="26" rx="5" fill="#2e7d32"/>
    <text x="77" y="54" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">SWIM API</text>

    <rect x="155" y="36" width="135" height="26" rx="5" fill="#2e7d32"/>
    <text x="222" y="54" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">Heartbeat Publisher</text>

    <rect x="10" y="70" width="135" height="26" rx="5" fill="#2e7d32"/>
    <text x="77" y="88" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">Outbox Pattern</text>

    <rect x="155" y="70" width="135" height="26" rx="5" fill="#2e7d32"/>
    <text x="222" y="88" text-anchor="middle" fill="#fff" font-family="Red Hat Text, sans-serif" font-size="11">Queue Lifecycle</text>

    <text x="150" y="116" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">Yellow Profile compliant</text>
    <text x="150" y="132" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">SWIM Registry conformant</text>
  </g>

  <!-- Arrow with mTLS badge -->
  <path d="M660 490 L730 490" stroke="#64ffda" stroke-width="3" marker-end="url(#arrG)"/>
  <rect x="670" y="468" width="50" height="16" rx="8" fill="#d4a106"/>
  <text x="695" y="479" text-anchor="middle" fill="#000" font-family="Red Hat Mono, monospace" font-size="9" font-weight="600">mTLS</text>

  <!-- Simulated Client -->
  <g transform="translate(740, 420)">
    <rect x="0" y="0" width="210" height="140" rx="10" fill="#1a1a2e" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#333"/>
    <rect x="0" y="20" width="210" height="6" fill="#333"/>
    <text x="105" y="20" text-anchor="middle" fill="#bbb" font-family="Red Hat Display, sans-serif" font-size="12" font-weight="600">Simulated Client</text>

    <text x="105" y="52" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">AMQP Subscriber</text>
    <text x="105" y="72" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">REST API Consumer</text>
    <text x="105" y="92" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="11">Subscription Tester</text>

    <text x="105" y="125" text-anchor="middle" fill="#64ffda" font-family="Red Hat Mono, monospace" font-size="10">Deploys alongside</text>
  </g>

  <!-- ====== BOTTOM ====== -->
  <rect x="200" y="595" width="800" height="42" rx="10" fill="#0f1624" stroke="#d4a106" stroke-width="1.5"/>
  <text x="600" y="622" text-anchor="middle" fill="#fff" font-family="Red Hat Display, sans-serif" font-size="17" font-weight="600">Develop &#8594; Test &#8594; Validate &#8594; Deploy with confidence</text>

  <text x="600" y="668" text-anchor="middle" fill="#8892b0" font-family="Red Hat Text, sans-serif" font-size="15">Full mTLS pipeline validated locally &#8212; no external access required</text>

  <rect x="410" y="682" width="380" height="28" rx="8" fill="#d4a106"/>
  <text x="600" y="701" text-anchor="middle" fill="#000" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="600">Zero-Trust Security &#183; Validated Before Production</text>
</svg>
