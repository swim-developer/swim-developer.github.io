<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style type="text/css">
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        </style>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
        </marker>
        <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
    </defs>

    <!-- ==================== TITLE ==================== -->
    <text x="490" y="35" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="24" font-family="'Inter', sans-serif">E2E Test — Part 1: Authentication &amp; Subscription</text>
    <text x="490" y="58" text-anchor="middle" fill="#888888" font-size="16" font-family="'Inter', sans-serif">mTLS + OAuth2/OIDC | Yellow Profile Compliant</text>

    <!-- ==================== PARTICIPANTS ==================== -->
    
    <!-- User (UML Actor) -->
    <circle cx="70" cy="95" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="107" x2="70" y2="125" stroke="#ffffff" stroke-width="2"/>
    <line x1="50" y1="115" x2="90" y2="115" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="125" x2="55" y2="145" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="125" x2="85" y2="145" stroke="#ffffff" stroke-width="2"/>
    <text x="70" y="165" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">User</text>
    <line x1="70" y1="175" x2="70" y2="620" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- MockClient -->
    <rect x="160" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="215" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">MockClient</text>
    <line x1="215" y1="145" x2="215" y2="620" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Keycloak -->
    <rect x="330" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="385" y="115" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Keycloak</text>
    <text x="385" y="132" text-anchor="middle" fill="#888888" font-size="14" font-family="'Inter', sans-serif">«external»</text>
    <line x1="385" y1="145" x2="385" y2="620" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Provider -->
    <rect x="500" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="555" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Provider</text>
    <line x1="555" y1="145" x2="555" y2="620" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Kubernetes -->
    <rect x="670" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="725" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Kubernetes</text>
    <line x1="725" y1="145" x2="725" y2="620" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- AMQ Broker -->
    <rect x="840" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="895" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">AMQ Broker</text>
    <line x1="895" y1="145" x2="895" y2="620" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- ==================== PHASE 1: AUTHENTICATION ==================== -->
    <text x="30" y="210" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">AUTHENTICATION</text>
    <line x1="30" y1="218" x2="170" y2="218" stroke="#444444" stroke-width="1"/>

    <!-- 1. Login -->
    <line x1="75" y1="245" x2="210" y2="245" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="142" y="238" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">1: login()</text>

    <!-- 2. OAuth2 redirect -->
    <line x1="220" y1="280" x2="380" y2="280" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="300" y="273" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">2: authenticate()</text>

    <!-- 3. JWT Token -->
    <line x1="380" y1="315" x2="220" y2="315" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="300" y="308" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">3: JWT {swim-subscriber}</text>

    <!-- ==================== PHASE 2: CREATE SUBSCRIPTION ==================== -->
    <text x="30" y="365" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">CREATE SUBSCRIPTION</text>
    <line x1="30" y1="373" x2="210" y2="373" stroke="#444444" stroke-width="1"/>

    <!-- 4. Subscribe -->
    <line x1="75" y1="400" x2="210" y2="400" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="142" y="393" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">4: createSubscription(filters)</text>

    <!-- 5. POST /subscriptions -->
    <line x1="220" y1="435" x2="550" y2="435" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="385" y="428" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">5: POST /subscriptions [mTLS+JWT]</text>

    <!-- 6. Create Queue CR + Secret -->
    <line x1="560" y1="470" x2="720" y2="470" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="640" y="463" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">6: create(QueueCR, Secret)</text>

    <!-- 7. Provision Queue -->
    <line x1="730" y1="505" x2="890" y2="505" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="810" y="498" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">7: provisionQueue()</text>

    <!-- 8. Response to Provider -->
    <line x1="720" y1="540" x2="560" y2="540" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="640" y="533" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">8: created</text>

    <!-- 9. Response to MockClient -->
    <line x1="550" y1="575" x2="220" y2="575" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="385" y="568" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">9: {subscriptionId, queueName}</text>

    <!-- 10. Response to User -->
    <line x1="210" y1="610" x2="75" y2="610" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="142" y="603" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">10: subscriptionCreated</text>

    <!-- ==================== LEGEND ==================== -->
    <rect x="30" y="650" width="940" height="40" rx="4" fill="#1a1a1a" stroke="#444444" stroke-width="1"/>
    
    <text x="50" y="675" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">LEGEND:</text>
    
    <line x1="130" y1="670" x2="180" y2="670" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="205" y="675" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">Sync</text>
    
    <line x1="260" y1="670" x2="310" y2="670" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="335" y="675" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">Return</text>

    <text x="420" y="675" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">Provider creates Queue via Kubernetes → AMQ Broker</text>
    
    <!-- Badge -->
    <rect x="850" y="655" width="100" height="28" rx="14" fill="#ffc107"/>
    <text x="900" y="675" text-anchor="middle" fill="#000000" font-weight="600" font-size="14" font-family="'Inter', sans-serif">Part 1/2</text>

</svg>

