<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1310 1400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style type="text/css">
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        </style>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
        </marker>
        <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
    </defs>

    <!-- ==================== TITLE ==================== -->
    <text x="655" y="35" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="28" font-family="'Inter', sans-serif">E2E Test — DNOTAM Subscription &amp; Event Delivery</text>
    <text x="655" y="60" text-anchor="middle" fill="#888888" font-size="18" font-family="'Inter', sans-serif">mTLS + OAuth2/OIDC | Yellow Profile Compliant</text>

    <!-- ==================== PARTICIPANTS ==================== -->
    
    <!-- User (UML Actor) -->
    <circle cx="70" cy="95" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="107" x2="70" y2="125" stroke="#ffffff" stroke-width="2"/>
    <line x1="50" y1="115" x2="90" y2="115" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="125" x2="55" y2="145" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="125" x2="85" y2="145" stroke="#ffffff" stroke-width="2"/>
    <text x="70" y="165" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">User</text>
    <line x1="70" y1="175" x2="70" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- MockClient -->
    <rect x="140" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="195" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">MockClient</text>
    <line x1="195" y1="145" x2="195" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Keycloak -->
    <rect x="290" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="345" y="115" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Keycloak</text>
    <text x="345" y="132" text-anchor="middle" fill="#888888" font-size="14" font-family="'Inter', sans-serif">«external»</text>
    <line x1="345" y1="145" x2="345" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Provider -->
    <rect x="440" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="495" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Provider</text>
    <line x1="495" y1="145" x2="495" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Kubernetes -->
    <rect x="590" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="645" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Kubernetes</text>
    <line x1="645" y1="145" x2="645" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- AMQ Broker -->
    <rect x="740" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="795" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">AMQ Broker</text>
    <line x1="795" y1="145" x2="795" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Kafka -->
    <rect x="890" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="945" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Kafka</text>
    <line x1="945" y1="145" x2="945" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Consumer -->
    <rect x="1040" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="1095" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">Consumer</text>
    <line x1="1095" y1="145" x2="1095" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- MockServer -->
    <rect x="1190" y="90" width="110" height="50" rx="4" fill="#2a2a2a" stroke="#888888" stroke-width="1"/>
    <text x="1245" y="120" text-anchor="middle" fill="#ffffff" font-weight="500" font-size="14" font-family="'Inter', sans-serif">MockServer</text>
    <line x1="1245" y1="145" x2="1245" y2="1320" stroke="#666666" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- ==================== PHASE 1: AUTHENTICATION ==================== -->
    <text x="30" y="210" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">AUTHENTICATION</text>
    <line x1="30" y1="218" x2="170" y2="218" stroke="#444444" stroke-width="1"/>

    <!-- 1. Login -->
    <line x1="75" y1="245" x2="190" y2="245" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="132" y="238" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">1: login()</text>

    <!-- 2. OAuth2 redirect -->
    <line x1="200" y1="280" x2="340" y2="280" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="270" y="273" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">2: authenticate()</text>

    <!-- 3. JWT Token -->
    <line x1="340" y1="315" x2="200" y2="315" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="270" y="308" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">3: JWT {swim-subscriber}</text>

    <!-- ==================== PHASE 2: CREATE SUBSCRIPTION ==================== -->
    <text x="30" y="365" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">CREATE SUBSCRIPTION</text>
    <line x1="30" y1="373" x2="210" y2="373" stroke="#444444" stroke-width="1"/>

    <!-- 4. Subscribe -->
    <line x1="75" y1="400" x2="190" y2="400" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="132" y="393" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">4: createSubscription(filters)</text>

    <!-- 5. POST /subscriptions -->
    <line x1="200" y1="435" x2="490" y2="435" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="345" y="428" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">5: POST /subscriptions [mTLS+JWT]</text>

    <!-- 6. Create Queue CR + Secret -->
    <line x1="500" y1="470" x2="640" y2="470" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="570" y="463" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">6: create(QueueCR, Secret)</text>

    <!-- 7. Provision Queue -->
    <line x1="650" y1="505" x2="790" y2="505" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="720" y="498" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">7: provisionQueue()</text>

    <!-- 8. Response to Provider -->
    <line x1="640" y1="540" x2="500" y2="540" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="570" y="533" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">8: created</text>

    <!-- 9. Response to MockClient -->
    <line x1="490" y1="575" x2="200" y2="575" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="345" y="568" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">9: {subscriptionId, queueName}</text>

    <!-- 10. Response to User -->
    <line x1="190" y1="610" x2="75" y2="610" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="132" y="603" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">10: subscriptionCreated</text>

    <!-- ==================== PHASE 3: ACTIVATE & CONNECT ==================== -->
    <text x="30" y="660" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">ACTIVATE &amp; CONNECT</text>
    <line x1="30" y1="668" x2="200" y2="668" stroke="#444444" stroke-width="1"/>

    <!-- 11. Activate -->
    <line x1="75" y1="695" x2="190" y2="695" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="132" y="688" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">11: activate(subscriptionId)</text>

    <!-- 12. PUT status -->
    <line x1="200" y1="730" x2="490" y2="730" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="345" y="723" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">12: PUT {status: ACTIVE}</text>

    <!-- 13. Connect AMQP -->
    <line x1="75" y1="770" x2="190" y2="770" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="132" y="763" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">13: connect(broker)</text>

    <!-- 14. AMQP Connect -->
    <line x1="200" y1="805" x2="790" y2="805" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="495" y="798" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">14: AMQP 1.0 connect [mTLS + user/pass]</text>

    <!-- 15. Validate with Keycloak -->
    <line x1="790" y1="840" x2="350" y2="840" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="570" y="833" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">15: validateCredentials(user, pass)</text>

    <!-- 16. Token validated -->
    <line x1="350" y1="875" x2="790" y2="875" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="570" y="868" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">16: tokenValidated</text>

    <!-- 17. Connection established -->
    <line x1="790" y1="910" x2="200" y2="910" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="495" y="903" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">17: connected</text>

    <!-- ==================== PHASE 4: EVENT FLOW ==================== -->
    <text x="30" y="960" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">EVENT FLOW</text>
    <line x1="30" y1="968" x2="130" y2="968" stroke="#444444" stroke-width="1"/>

    <!-- 18. Open Messages tab -->
    <line x1="75" y1="995" x2="190" y2="995" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="132" y="988" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">18: openMessagesTab()</text>

    <!-- 19. Send event via MockServer -->
    <line x1="75" y1="1030" x2="1240" y2="1030" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="657" y="1023" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">19: sendEvent(DNOTAM: RWY.CLS + EGLL)</text>

    <!-- 20. MockServer publishes -->
    <rect x="1205" y="1050" width="80" height="25" rx="3" fill="#333333" stroke="#555555" stroke-width="1"/>
    <text x="1245" y="1068" text-anchor="middle" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">publish</text>

    <!-- 21. Consumer receives -->
    <line x1="1240" y1="1095" x2="1100" y2="1095" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1170" y="1088" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">20: AMQP message</text>

    <!-- 22. Consumer to Kafka -->
    <line x1="1090" y1="1130" x2="950" y2="1130" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1020" y="1123" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">21: publish(event)</text>

    <!-- 23. Provider consumes from Kafka -->
    <line x1="940" y1="1165" x2="500" y2="1165" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="720" y="1158" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">22: consume()</text>

    <!-- 24. Provider publishes to Broker -->
    <line x1="500" y1="1200" x2="790" y2="1200" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="1193" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">23: publishToQueue(subscriptionId)</text>

    <!-- ==================== PHASE 5: DELIVERY ==================== -->
    <text x="30" y="1250" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">DELIVERY</text>
    <line x1="30" y1="1258" x2="110" y2="1258" stroke="#444444" stroke-width="1"/>

    <!-- 25. Broker delivers -->
    <line x1="790" y1="1285" x2="200" y2="1285" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="495" y="1278" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">24: deliver(message) [filter matched]</text>

    <!-- 26. Display to user -->
    <line x1="190" y1="1320" x2="75" y2="1320" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="132" y="1313" text-anchor="middle" fill="#cccccc" font-size="14" font-family="'Inter', sans-serif">25: displayEvent()</text>

    <!-- ==================== LEGEND ==================== -->
    <rect x="30" y="1350" width="1270" height="40" rx="4" fill="#1a1a1a" stroke="#444444" stroke-width="1"/>
    
    <text x="50" y="1375" fill="#888888" font-weight="600" font-size="14" font-family="'Inter', sans-serif">LEGEND:</text>
    
    <!-- Sync message -->
    <line x1="130" y1="1370" x2="180" y2="1370" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="205" y="1375" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">Sync</text>
    
    <!-- Async/Return message -->
    <line x1="270" y1="1370" x2="320" y2="1370" stroke="#666666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>
    <text x="345" y="1375" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">Return</text>

    <!-- Protocols -->
    <text x="450" y="1375" fill="#aaaaaa" font-size="14" font-family="'Inter', sans-serif">Protocols: REST (mTLS+JWT) | AMQP 1.0 (mTLS+OIDC) | Kafka</text>
    
    <!-- Badge -->
    <rect x="1150" y="1355" width="130" height="28" rx="14" fill="#ffc107"/>
    <text x="1215" y="1375" text-anchor="middle" fill="#000000" font-weight="600" font-size="14" font-family="'Inter', sans-serif">Yellow Profile</text>

</svg>
